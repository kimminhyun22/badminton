<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>민턴LIVE 테스트 명부 넣기</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;background:linear-gradient(180deg,#eef5ff,#fff);color:#1f2937}
  .wrap{max-width:520px;margin:0 auto;padding:34px 18px}
  .card{border:1px solid #d9e6fb;border-radius:26px;background:#fff;padding:22px;box-shadow:0 18px 44px rgba(35,55,90,.12)}
  h1{font-size:24px;letter-spacing:-.05em;margin:0 0 8px}
  p{color:#6b7280;line-height:1.6;margin:0 0 16px;font-weight:700}
  .state{border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;border-radius:18px;padding:12px 14px;font-weight:900;margin:14px 0}
  .state.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}
  .actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
  a,button{appearance:none;text-decoration:none;text-align:center;border:1.5px solid #bfdbfe;border-radius:18px;background:#f7fbff;color:#315fb2;padding:15px 14px;font-weight:1000;font-size:16px}
  .primary{background:#5b8def;color:#fff;border-color:#5b8def;box-shadow:0 12px 26px rgba(91,141,239,.22)}
  small{display:block;color:#8b95a5;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>민턴LIVE 테스트 명부</h1>
    <p>32명 가데이터와 테스트 회원 링크를 넣고 있습니다. 운영 데이터와 분리된 <b>DFAKE201</b> 테스트 링크입니다.</p>
    <div class="state warn" id="state">준비 중...</div>
    <div class="actions" id="actions" style="display:none">
      <a class="primary" href="index.html?v=1.10.230&sample=1&fresh=1">관리자 페이지 보기</a>
      <a href="checkin.html?id=DFAKE201&v=1.10.230&sample=1&fresh=1">회원 페이지 보기</a>
    </div>
    <small>회원 페이지에서는 김민현 선수가 이미 선택된 상태로 보이도록 저장됩니다.</small>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FB_CONFIG={
  apiKey:"AIzaSyAo2AfN_ekzelCe17x1s6CVqCet0Hsq4II",
  authDomain:"kokmatch-23b31.firebaseapp.com",
  databaseURL:"https://kokmatch-23b31-default-rtdb.firebaseio.com",
  projectId:"kokmatch-23b31",
  storageBucket:"kokmatch-23b31.firebasestorage.app",
  messagingSenderId:"57349245242",
  appId:"1:57349245242:web:6c0ac6f4cc131b44192803"
};
function buildSample(){
  const now=Date.now();
  const names=[
    ['장세훈','A','남'],['백철민','B','남'],['이은하','A','여'],['최애랑','A','여'],
    ['김재관','C','남'],['이현','C','남'],['정인기','B','남'],['현지영','B','여'],
    ['금민경','A','여'],['김미정','A','여'],['김민선','A','여'],['안세원','B','남'],
    ['이성원','B','남'],['송은정','B','여'],['전인기','C','남'],['김병주','C','남'],
    ['조병훈','C','남'],['최경민','C','남'],['조계홍','D','남'],['조태환','D','남'],
    ['박대현','B','남'],['김종길','C','남'],['이준원','B','남'],['김민현','B','남'],
    ['문정희','C','여'],['오지혜','D','여'],['홍길동','D','남'],['유가람','C','여'],
    ['게스트 민준','C','남',true],['게스트 서연','C','여',true],['윤성호','B','남'],['박지은','B','여']
  ];
  const levelMap={S:6,A:5,B:4,C:3,D:2,E:1};
  const players=names.map((row,i)=>{
    const [name,grade,genderKo,isGuest]=row;
    const status=i<22?'wait':(i<28?'planned':(i<30?'rest':'wait'));
    return {
      id:`dfake_${String(i+1).padStart(2,'0')}`,name,grade,level:levelMap[grade]||3,gender:genderKo==='여'?'F':'M',
      ageGroup:i%3===0?'30대':'40대',status,joinedAt:now-i*60000,waitFrom:now-i*70000,lastStatusAt:now-i*60000,
      games:Math.floor(i/8),lastPlayedSeq:0,partnerCount:{},opponentCount:{},partnerName:null,partnerId:null,
      currentMatchId:null,afterMatchStatus:null,team:'',isGuest:!!isGuest
    };
  });
  const sessionPlayers=players.map(p=>({
    id:p.id,name:p.name,status:p.status,statusLabel:{invited:'미응답',planned:'참석',wait:'시작',playing:'경기중',rest:'휴식',done:'종료'}[p.status]||'시작',
    isGuest:!!p.isGuest,games:p.games||0,voteLocked:false,locked:false
  }));
  const session={
    title:'민턴LIVE 테스트 명부',updatedAt:now,createdAt:now,voteDeadlineAt:'',voteClosed:false,expiresAt:now+48*60*60*1000,
    players:sessionPlayers,
    statuses:[{key:'planned',label:'참석',desc:''},{key:'wait',label:'시작',desc:''},{key:'rest',label:'휴식',desc:''},{key:'done',label:'종료',desc:''}],
    event:{
      updatedAt:now,activeCount:2,completed:1,
      active:[
        {court:1,t1:['장세훈','김민현'],t2:['이은하','김미정'],endAt:now+8*60*1000},
        {court:2,t1:['백철민','안세원'],t2:['현지영','금민경'],endAt:now+4*60*1000}
      ],
      next:[
        {idx:1,queueId:'q_fake_1',targetMatchId:'m_fake_2',targetCourt:2,cue:'2코트 예상',cueState:'soon',cueDetail:'종료 순서에 따라 바뀔 수 있습니다',t1:['이성원','송은정'],t2:['정인기','최애랑'],playerIds:['dfake_13','dfake_14','dfake_07','dfake_04']},
        {idx:2,queueId:'q_fake_2',targetMatchId:'m_fake_1',targetCourt:1,cue:'1코트 예상',cueState:'',cueDetail:'예상 코트는 바뀔 수 있습니다',t1:['김재관','문정희'],t2:['이현','오지혜'],playerIds:['dfake_05','dfake_25','dfake_06','dfake_26']}
      ]
    }
  };
  const state={
    savedAt:now,courts:4,autoAssign:false,teamMode:false,teamLocked:false,teamNames:{blue:'청 팀',white:'홍 팀'},
    captains:{blue:{leader:'',sub:''},white:{leader:'',sub:''}},closing:false,closingAt:'',voteDeadlineAt:'',
    players,matches:[],queue:[],reservations:[],seq:1,waveStarts:0,checkinId:'DFAKE201',checkinCreatedAt:now
  };
  return {now,players,state,session};
}
async function run(){
  const stateEl=document.getElementById('state');
  const actions=document.getElementById('actions');
  const sample=buildSample();
  localStorage.setItem('kokmatch_daily_v1',JSON.stringify(sample.state));
  localStorage.setItem('kokmatch_daily_checkin_id','DFAKE201');
  localStorage.setItem('kokmatch_daily_checkin_created_at',String(sample.now));
  localStorage.setItem('kokmatch_checkin_last_DFAKE201',JSON.stringify({playerId:'dfake_24',playerName:'김민현',status:'wait',savedAt:sample.now}));
  try{
    firebase.initializeApp(FB_CONFIG);
    await firebase.database().ref('live/checkin_DFAKE201').set({
      kind:'dailyCheckin',createdAt:sample.now,updatedAt:sample.now,expiresAt:sample.session.expiresAt,session:sample.session,requests:null
    });
    stateEl.className='state';
    stateEl.textContent='완료: 관리자/회원 테스트 데이터를 넣었습니다.';
  }catch(e){
    stateEl.className='state warn';
    stateEl.textContent='로컬 명부는 넣었습니다. 회원 링크 서버 반영은 실패했습니다: '+(e&&e.message?e.message:e);
  }
  actions.style.display='grid';
}
run();
</script>
</body>
</html>
