function createOfficialOperationId(prefix){
  const safePrefix=String(prefix||'op').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,18)||'op';
  try{
    const bytes=new Uint8Array(12);
    crypto.getRandomValues(bytes);
    return `dov2_${safePrefix}_${Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}`;
  }catch(e){
    return `dov2_${safePrefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,12)}`;
  }
}
function createMemberStatusOperationId(){
  try{
    const bytes=new Uint8Array(12);
    crypto.getRandomValues(bytes);
    return `mps_${Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}`;
  }catch(e){
    return `mps_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,12)}`;
  }
}
// 서버가 "판단해서 거절한 것"과 "아예 닿지 못한 것"을 가릅니다.
// 닿지 못한 경우에만 옛 요청 경로로 넘겨야 임원이 중복 처리를 하지 않습니다.
function memberStatusTransportFailure(error){
  const code=String(error?.code||'').replace(/^functions\//,'').trim();
  if(!code)return true;
  return ['internal','unavailable','deadline-exceeded','resource-exhausted','cancelled','unknown','aborted'].includes(code);
}
function memberStatusCallableError(error){
  const message=String(error?.message||'').replace(/^Firebase:\s*/,'').trim();
  if(message&&(
    message.includes('상태') ||
    message.includes('민턴LIVE') ||
    message.includes('본인') ||
    message.includes('경기중') ||
    message.includes('일시 정지')
  ))return message;
  return '상태를 바로 반영하지 못했습니다. 네트워크를 확인한 뒤 다시 눌러 주세요.';
}
function officialCallableError(error){
  const message=String(error?.message||'').replace(/^Firebase:\s*/,'').trim();
  if(message.includes('임원 운영')||message.includes('운영 권한')||message.includes('운영 도우미')||message.includes('민턴LIVE')||message.includes('현재 상태'))return message;
  if(error?.code==='functions/permission-denied')return '현재 운영 권한을 확인하지 못했습니다. 아래 다시 연결을 눌러 주세요.';
  if(error?.code==='functions/failed-precondition')return '경기 상태가 이미 바뀌었습니다. 현재 화면을 확인한 뒤 다시 처리해 주세요.';
  return '서버 즉시 처리 연결에 실패했습니다. 네트워크를 확인한 뒤 다시 눌러 주세요.';
}
async function pushOfficialRequest(req,successText){
  if(eventFlowPaused()&&officialFlowOperationType(req?.type)){
    toast('현재 진행이 일시 정지되어 있습니다. 재개 후 다시 처리해 주세요.');
    return false;
  }
  if(isSampleMode()){
    officialRequests.push({key:'sample_'+Date.now(),...req,appliedAt:Date.now()});
    toast(successText);
    return true;
  }
  if(!db||!checkinId||!session||sendingKey||claimingOfficial)return false;
  if(sessionExpired()){showEndedLink();return false;}
  req={...req,operationId:req.operationId||createOfficialOperationId(req.type)};
  const actor=officialActor(req.actorPlayerId);
  if(!officialServerReady()&&actor){
    const claimed=await claimOfficialInvite(actor);
    if(!claimed&&!officialServerReady())return false;
  }
  const serverReady=officialServerReady();
  const serverCapable=officialServerCapable();
  const connected=operatorConnected();
  if(serverCapable&&!serverReady){
    toast('현재 운영 권한을 확인하지 못했습니다. 다시 연결을 눌러 주세요.');
    refreshOfficialConnection();
    return false;
  }
  if(!serverReady&&!connected){
    toast('운영 권한 연결에 실패했습니다. 네트워크와 현재 권한을 확인해 주세요.');
    refreshOfficialConnection();
    return false;
  }
  sendingKey='official_'+req.type;
  refreshOfficialConnection();
  try{
    if(serverReady){
      const callable=firebase.functions().httpsCallable('submitDailyOfficialRequest');
      const result=await callable({checkinId,grantToken:officialGrantToken,command:req});
      const receipt=result?.data||{};
      const row={
        key:receipt.requestId||req.operationId,
        ...req,
        serverRevision:Number(receipt.resultRevision||0),
        ...(receipt.serverResult?{serverResult:receipt.serverResult}:{}),
        ...(receipt.status==='applied'?{serverAppliedAt:Date.now()}:{serverRejectedAt:Date.now(),serverReason:receipt.reason||'현재 상태에서 처리할 수 없습니다.'})
      };
      officialRequests=officialRequests.filter(item=>item.key!==row.key);
      officialRequests.push(row);
      if(receipt.status!=='applied'){
        toast(row.serverReason);
        render();
        return false;
      }
      if(req.type==='official-partner-reservation'){
        toast(receipt.serverResult?.queueApplied
          ? `${successText} · 현재 대진 순서에서 반영됨`
          : `${successText} · 대진 반영 대기`);
      }else{
        toast(`${successText} · 바로 반영됨`);
      }
      return true;
    }
    const ref=db.ref(checkinPath()+'/requests/'+req.operationId);
    await ref.set(req);
    officialRequests.push({key:req.operationId,...req});
    toast(`${successText} · 관리자 앱에서 자동 적용 중`);
    return true;
  }catch(e){
    if(serverReady&&e?.code==='functions/permission-denied'){
      clearOfficialGrant('운영 권한 연결 시간이 끝났습니다. 다시 연결을 눌러 주세요.');
      toast(officialGrantError);
      render();
      return false;
    }
    toast(serverReady?officialCallableError(e):'운영 요청 전송에 실패했습니다. 다시 눌러 주세요.');
    return false;
  }finally{
    sendingKey='';
    refreshOfficialConnection();
  }
}

  const playerId=targetId||document.getElementById('officialTemporarySelect_'+actorId)?.value||'';

    type:'official-temporary-grant',
    actorPlayerId:actor.id,actorPlayerName:actor.name,

    expectedIsTemporaryOfficial:!!player.isTemporaryOfficial,

  },`${player.name} 운영 도우미 지정`);

  if(ok)render();
}

async function sendOfficialPartnerReservation(actorId,firstId,secondId){
  const actor=officialActor(actorId);
  // 두 id 가 오면 운영 현황 명단에서 두 명을 눌러 고른 경우입니다.
  const aId=firstId||document.getElementById('officialPartnerA_'+actorId)?.value||'';
  const bId=secondId||document.getElementById('officialPartnerB_'+actorId)?.value||'';
  const players=(session?.players||[]);
  const a=players.find(p=>p.id===aId),b=players.find(p=>p.id===bId);
  if(!actor||!a||!b)return toast('파트너 두 명을 선택해 주세요.');
  if(a.id===b.id)return toast('서로 다른 선수 두 명을 선택해 주세요.');
  if(session?.event?.finishMode)return toast('마무리 중에는 새 파트너 요청을 받지 않습니다.');
  if([a,b].some(p=>['invited','planned','done'].includes(p.status)))return toast('현재 운동 중인 선수만 접수할 수 있습니다.');
  if(officialPartnerGap([a,b])>=3)return toast('두 선수의 실력 차가 커 공정한 자동 대진으로 편성하기 어렵습니다.');
  if(officialRequests.some(r=>r.type==='official-partner-reservation'&&officialRequestPending(r)))return toast('앞선 파트너 접수를 확인 중입니다.');
  const conflict=officialPartnerReservations().find(r=>(r.team1||[]).some(id=>id===a.id||id===b.id));
  if(conflict)return toast('이미 파트너 접수에 포함된 선수가 있습니다.');
  const now=Date.now();
  const ok=await pushOfficialRequest({
    type:'official-partner-reservation',
    actorPlayerId:actor.id,actorPlayerName:actor.name,
    playerIds:[a.id,b.id],playerNames:[a.name,b.name],
    createdAt:now,expiresAt:now+OFFICIAL_OPERATION_TTL_MS,
    observedUpdatedAt:session.updatedAt||0,
    source:'club-official-support'
  },`${a.name} · ${b.name} 파트너 접수`);
  if(ok){
    if(isSampleMode()){
      session.reservations=session.reservations||[];
      session.reservations.push({id:'sample_pair_'+now,mode:'pair',team1:[a.id,b.id],team2:[],label:`${a.name}·${b.name} 같은 편`,statusText:'대진 반영 대기'});
    }
    render();
  }
}

async function sendOfficialArrival(actorId,candidateKey){
  const actor=officialActor(actorId);
  // candidateKey 가 오면 운영 현황 명단에서 바로 누른 경우입니다.
  const select=document.getElementById('officialArrivalSelect_'+actorId);
  const wanted=candidateKey||select?.value||'';
  const candidate=officialArrivalPlayers().find(item=>String(item.candidateKey)===String(wanted));
  let target=candidate?.playerId?(session?.players||[]).find(player=>String(player.id)===String(candidate.playerId)):null;
  if(!actor||!candidate)return toast('임원 또는 도착 선수를 다시 확인해 주세요.');
  if(candidate.kind!=='roster'&&(!target||!['invited','planned'].includes(target.status)))return toast('이미 참가 상태가 바뀐 선수입니다.');
  const pending=officialRequests.some(r=>['official-player-arrival','official-player-add'].includes(r.type)&&officialRequestPending(r)&&String(r.candidateKey||'')===String(candidate.candidateKey));
  if(pending)return toast(`${candidate.name}님의 참가 등록을 확인 중입니다.`);
  if(!confirm(`${candidate.name}님이 현장에 도착했나요?\n\n참가 등록하면 대기열과 지각 우선배정에 바로 반영됩니다.`))return;
  const now=Date.now();
  const operationId=createOfficialOperationId('arrival');
  const request=candidate.kind==='roster'?{
    type:'official-player-add',
    operationId,
    actorPlayerId:actor.id,actorPlayerName:actor.name,
    candidateKey:candidate.candidateKey,
    memberId:candidate.memberId,playerId:`dpv2_${operationId}`,playerName:candidate.name,expectedName:candidate.name,
    createdAt:now,expiresAt:now+OFFICIAL_OPERATION_TTL_MS,
    observedUpdatedAt:session.updatedAt||0,
    source:'club-official-arrival'
  }:{
    type:'official-player-arrival',
    operationId,
    actorPlayerId:actor.id,actorPlayerName:actor.name,
    candidateKey:candidate.candidateKey,
    playerId:target.id,playerName:target.name,status:'wait',
    expectedStatus:target.status||'',
    expectedLastStatusAt:target.lastStatusAt||0,
    createdAt:now,expiresAt:now+OFFICIAL_OPERATION_TTL_MS,
    observedUpdatedAt:session.updatedAt||0,
    source:'club-official-arrival'
  };
  const ok=await pushOfficialRequest(request,`${candidate.name} · 참가 등록 요청`);
  // "몇 번째에 짜지는지"(운영자 2026-08-10 실전 피드백) — 지각자는 바로 대진에
  // 들어가는 게 아니라 다음 보충 때 우선 편성됩니다. 물어보는 회원에게 답할 수
  // 있게 규칙을 안내합니다. 실제 순번은 대기표가 비는 시점에 정해집니다.
  if(ok&&!isSampleMode()){
    const queued=eventNextList().length;
    toast(`${candidate.name}님 등록 · 처음 2경기 우선 편성 — 지금 대기 ${queued}개 뒤 새 대진부터 앞순위로 들어가요`);
  }
  if(ok&&isSampleMode()){
    if(candidate.kind==='roster'){
      target={id:request.playerId,name:candidate.name,grade:candidate.grade||'C',gender:candidate.gender||'M',ageGroup:candidate.ageGroup||'40대',status:'invited',games:0,isGuest:false,isClubOfficial:false};
      session.players.push(target);
    }
    target.status='wait';
    target.statusLabel=compactLabel('wait');
    target.preArrivalVisible=false;
    target.registrationCancelled=false;
    target.locked=false;
    target.joinedAt=now;
    target.lastStatusAt=now;
    target.arrivalConfirmedBy=actor.id;
    target.arrivalConfirmedByName=actor.name;
    target.arrivalConfirmedAt=now;
    target.arrivalConfirmedSource='club-official-arrival';
    session.arrivalCandidates=(session.arrivalCandidates||[]).filter(item=>String(item.candidateKey)!==String(candidate.candidateKey));
    render();
  }
}

async function sendOfficialPlayerStatus(actorId,status,targetId){
  const actor=officialActor(actorId);
  // targetId가 오면 그 선수를(운영 현황 명단에서 바로 누른 경우),
  // 없으면 종전대로 드롭다운에서 고른 선수를 처리합니다.
  const select=document.getElementById('officialPlayerSelect_'+actorId);
  const wanted=targetId||select?.value;
  const target=(session?.players||[]).find(p=>String(p.id)===String(wanted));
  if(!actor||!target)return toast('임원 또는 선수를 다시 확인해 주세요.');
  const playing=target.locked||target.status==='playing';
  if(playing&&!['rest','done'].includes(status))return toast('경기중에는 경기 후 휴식 또는 종료만 표시할 수 있어요.');
  if(playing&&target.afterMatchStatus===status)return toast(`이미 경기 후 ${compactLabel(status)}로 표시되어 있습니다.`);
  if(!playing&&compactLabel(target.status)===compactLabel(status))return toast('이미 같은 상태입니다.');
  const actionLabel=playing?`경기 후 ${compactLabel(status)}`:compactLabel(status);
  if(status==='done'&&!confirm(`${target.name}님을 ${playing?'경기가 끝난 뒤 ':'오늘 '}운동 종료로 처리할까요?`))return;
  const now=Date.now();
  const ok=await pushOfficialRequest({
    type:'official-player-status',
    actorPlayerId:actor.id,actorPlayerName:actor.name,
    playerId:target.id,playerName:target.name,status,
    expectedStatus:target.status||'',
    expectedCurrentMatchId:target.currentMatchId||'',
    expectedLastStatusAt:target.lastStatusAt||0,
    createdAt:now,expiresAt:now+OFFICIAL_OPERATION_TTL_MS,
    observedUpdatedAt:session.updatedAt||0,
    source:'club-official-support'
  },`${target.name} · ${actionLabel} 처리 요청`);
  if(ok&&isSampleMode()){
    if(playing)target.afterMatchStatus=status;
    else target.status=status;
    target.statusLabel=playing?target.statusLabel:compactLabel(status);
    target.lastStatusAt=Date.now();
    render();
  }
}
function sampleAutoStartQueue(q,court,matchId,sourceMatchId,startedAt){
  if(!q||!session?.event)return null;
  const list=session.event.next||[];
  const index=list.findIndex(item=>String(item.queueId||item.id||'')===String(q.queueId||q.id||''));
  if(index>=0)list.splice(index,1);
  const now=startedAt||Date.now();
  const match={
    id:matchId,court,seq:Math.max(0,...(session.event.active||[]).map(item=>Number(item.seq||0)))+1,
    type:q.type||'예외',teamMode:!!q.teamMode,labelA:q.labelA||'A팀',labelB:q.labelB||'B팀',
    t1:[...(q.t1||[])],t2:[...(q.t2||[])],t1Ids:[...(q.t1Ids||[])],t2Ids:[...(q.t2Ids||[])],playerIds:[...(q.playerIds||[])],
    startedAt:now,expectedMinutes:15,endAt:now+15*60000,remain:15,timerState:'normal',transitionStarted:false,
    autoHandoffAt:now,autoHandoffExpiresAt:now+2*60*1000,autoHandoffSource:'sample-auto-handoff',autoHandoffSourceMatchId:sourceMatchId||'',
    autoHandoffQueue:JSON.parse(JSON.stringify(q))
  };
  (session.event.active||[]).push(match);
  (match.playerIds||[]).forEach(id=>{
    const player=(session.players||[]).find(item=>item.id===id);
    if(player){player.status='playing';player.statusLabel='경기중';player.locked=true;player.currentMatchId=match.id;}
  });
  list.forEach((item,i)=>{item.idx=i+1;});
  session.event.activeCount=session.event.active.length;
  return match;
}
function officialQueuedPlayerIds(){
  const ids=new Set();
  ((session?.event?.next)||[]).forEach(item=>{
    const list=item?.playerIds||[...(item?.t1Ids||[]),...(item?.t2Ids||[])];
    (list||[]).forEach(id=>ids.add(String(id)));
  });
  return ids;
}
// 그 선수가 몇 순위 대진에 잡혀 있는지(없으면 0). 화면 순서 기준입니다.
function officialQueueIndexOfPlayer(playerId){
  const target=String(playerId||'');
  const list=eventNextList();
  for(let i=0;i<list.length;i++){
    const item=list[i];
    const ids=item?.playerIds||[...(item?.t1Ids||[]),...(item?.t2Ids||[])];
    if((ids||[]).some(id=>String(id)===target))return i+1;
  }
  return 0;
}
// 진행 중 경기의 선수 교체(운영자 결정 2026-08-08). 코트에서 4명이 동의하면
// 임원이 그 자리에서 처리합니다. 대기 선수 투입은 나간 선수를 휴식으로,
// 다른 코트 선수를 고르면 두 코트를 맞교환합니다. 경기 수는 종료 시점 명단 기준.
// 진행 코트 카드의 선수 이름을 누르면 후보 시트가 뜹니다(운영자 요청 2026-08-09
// "이름을 누르면 선수교체 창"). 번호·이름 입력 prompt 는 폐지했습니다.
// 후보는 잘라내지 않습니다 — 운영자가 지목한 선수가 목록에 없으면 그 교체를 못 합니다.
function officialActiveReplaceCandidates(m){
  const ids=[...(m.t1Ids||[]),...(m.t2Ids||[])].map(String);
  // 다음 대진에 예약된 선수도 후보에 둡니다 — 감추지 않고 뒤로만 미룹니다.
  const queued=officialQueuedPlayerIds();
  const waiting=(session?.players||[])
    .filter(p=>p&&p.name&&String(p.status||'')==='wait'&&!p.currentMatchId&&!ids.includes(String(p.id)))
    .map(p=>({id:String(p.id),name:p.name,queued:queued.has(String(p.id)),games:p.games||0}))
    .sort((a,b)=>{
      if(a.queued!==b.queued)return a.queued?1:-1;
      if(a.games!==b.games)return a.games-b.games;
      return a.name.localeCompare(b.name,'ko');
    })
    .map(p=>({...p,meta:p.queued?`${p.games}G · 다음 대진 예정`:`${p.games}G`}));
  const others=[];
  ((session?.event?.active||[])||[]).forEach(o=>{
    if(String(o.id||'')===String(m.id||''))return;
    const oi=[...(o.t1Ids||[]),...(o.t2Ids||[])].map(String);
    const on=[...(o.t1||[]),...(o.t2||[])];
    oi.forEach((id,i)=>others.push({id,name:on[i]||'선수',meta:`${o.court}코트 · 맞교환`,swap:true,court:o.court}));
  });
  return {waiting,others};
}
let _officialReplaceCtx=null;
function closeOfficialReplacePicker(){
  _officialReplaceCtx=null;
  const el=document.getElementById('replacePicker');
  if(el)el.classList.add('hidden');
}
function openOfficialActiveReplace(actorId,matchId,outPlayerId){
  const actor=officialActor(actorId);
  const m=((session?.event?.active||[])||[]).find(x=>String(x.id||'')===String(matchId||''));
  if(!actor||!m)return toast('진행중 경기를 다시 확인해 주세요.');
  const ids=[...(m.t1Ids||[]),...(m.t2Ids||[])].map(String);
  const names=[...(m.t1||[]),...(m.t2||[])];
  const outIdx=ids.indexOf(String(outPlayerId||''));
  if(outIdx<0)return toast('교체할 선수를 이 경기에서 찾지 못했습니다.');
  const outName=names[outIdx]||'선수';
  const {waiting,others}=officialActiveReplaceCandidates(m);
  if(!waiting.length&&!others.length)return toast('교체 가능한 선수가 없습니다.');
  _officialReplaceCtx={kind:'active',actorId:String(actorId),matchId:String(m.id),outId:String(outPlayerId),outName,
    candidates:[...waiting,...others]};
  _officialReplaceSheetShow(`${m.court}코트 · ${outName} 대신 들어갈 선수를 누르세요`,[
    ['대기 선수',waiting],
    ['다른 코트 경기중 · 맞교환',others]
  ]);
}
function _officialReplaceSheetShow(subText,groups,title){
  const head=document.getElementById('replacePickerTitle');
  if(head)head.textContent=title||'선수 교체';
  const sub=document.getElementById('replacePickerSub');
  if(sub)sub.textContent=subText;
  const list=document.getElementById('replacePickerList');
  if(list){
    const row=c=>`<button type="button" class="replace-picker-row${c.swap?' swap':''}${c.queued?' queued':''}${c.playing?' playing':''}" onclick="pickOfficialReplaceCandidate('${esc(c.id)}')">
      <b>${esc(c.name)}</b><span>${esc(c.meta)}</span></button>`;
    list.innerHTML=groups
      .filter(([,items])=>items.length)
      .map(([label,items])=>`<div class="replace-picker-group">${esc(label)}</div>${items.map(row).join('')}`)
      .join('');
    list.scrollTop=0;
  }
  document.getElementById('replacePicker')?.classList.remove('hidden');
}
// 다음 대진 후보에는 제한을 두지 않습니다(운영자 2026-08-10). 경기 중인 선수는
// '경기중' 딱지를 달고 뒤에 서고, 고르면 그 대진은 선수의 경기 종료까지 투입이
// 보류됩니다(서버 queueReady). 다른 대기표에 있던 선수는 서버가 거기서 빼 옵니다.
// 휴식·종료·도착 전만 제외합니다 — 그 상태가 들어간 대진은 서버가 지워 버립니다.
function officialQueueCandidatePool(excludeIds){
  const skip=new Set((excludeIds||[]).map(String));
  const queued=officialQueuedPlayerIds();
  const activeCourtById=new Map();
  ((session?.event?.active)||[]).forEach(m=>[...(m.t1Ids||[]),...(m.t2Ids||[])].forEach(id=>activeCourtById.set(String(id),m.court)));
  return (session?.players||[])
    .filter(p=>p&&p.name&&!skip.has(String(p.id))&&!p.registrationCancelled)
    .filter(p=>['wait','playing'].includes(String(p.status||''))||p.currentMatchId)
    .map(p=>{
      const id=String(p.id);
      const playing=activeCourtById.has(id)||String(p.status||'')==='playing'||!!p.currentMatchId;
      const inQueue=!playing&&queued.has(id);
      const court=activeCourtById.get(id);
      // 몇 순위에 이미 잡혀 있는지 알려 줍니다(운영자 2026-08-13 "중복이면 경고").
      // 마무리 후 자율게임 신청이 겹칠 때 어느 대진을 건드리는지 보고 정해야 합니다.
      const queueIdx=inQueue?officialQueueIndexOfPlayer(id):0;
      return {id,name:p.name,games:p.games||0,playing,queued:inQueue,queueIdx,
        meta:playing?`${court?`${court}코트 `:''}경기중`:(inQueue?`${p.games||0}G · ${queueIdx?`${queueIdx}순위 예약됨`:'다음 대진 예정'}`:`${p.games||0}G`)};
    })
    .sort((a,b)=>{
      const rank=x=>x.playing?2:x.queued?1:0;
      if(rank(a)!==rank(b))return rank(a)-rank(b);
      if(a.games!==b.games)return a.games-b.games;
      return a.name.localeCompare(b.name,'ko');
    });
}
// 다음 대진의 선수 교체 — 진행 코트와 같은 이름 탭 → 시트 흐름(운영자 2026-08-10).
// 나간 선수는 대기로 돌아가고, 지정한 선수가 그 자리에 들어갑니다.
function openOfficialQueueReplace(actorId,queueId,outPlayerId){
  const actor=officialActor(actorId);
  const q=queueById(queueId);
  if(!actor||!q)return toast('교체할 다음 대진을 다시 확인해 주세요.');
  if(q.reservationId)return toast('게임신청으로 잡힌 대진은 신청을 먼저 정리해 주세요.');
  const qid=String(q.queueId||q.id||queueId);
  if(officialRequests.some(r=>r.type==='official-queue-replace'&&officialRequestPending(r)&&String(r.queueId||'')===qid)){
    return toast('이 대진의 교체를 확인하는 중입니다.');
  }
  const ids=(q.playerIds||[...(q.t1Ids||[]),...(q.t2Ids||[])]).map(String);
  const names=[...(q.t1||[]),...(q.t2||[])];
  const outIdx=ids.indexOf(String(outPlayerId||''));
  if(outIdx<0)return toast('교체할 선수를 이 대진에서 찾지 못했습니다.');
  const outName=names[outIdx]||(session?.players||[]).find(p=>String(p.id)===String(outPlayerId))?.name||'선수';
  const pool=officialQueueCandidatePool(ids);
  if(!pool.length)return toast('지금 넣을 수 있는 선수가 없습니다.');
  const ready=pool.filter(c=>!c.playing);
  const playing=pool.filter(c=>c.playing);
  _officialReplaceCtx={kind:'queue',actorId:String(actorId),queueId:qid,outId:String(outPlayerId),outName,
    candidates:pool};
  _officialReplaceSheetShow(`다음 대진 · ${outName} 대신 들어갈 선수를 누르세요`,[
    ['대기 선수',ready],
    ['경기중 — 경기 종료 후 투입',playing]
  ]);
}
async function pickOfficialReplaceCandidate(inPlayerId){
  const ctx=_officialReplaceCtx;
  if(!ctx)return;
  if(ctx.kind==='compose')return _officialComposeToggle(String(inPlayerId||''));
  if(ctx.kind==='arrival'){
    const chosen=ctx.candidates.find(c=>String(c.id)===String(inPlayerId||''));
    if(!chosen)return toast('명부 후보를 다시 확인해 주세요.');
    closeOfficialReplacePicker();
    return sendOfficialArrival(ctx.actorId,chosen.id);
  }
  const chosen=ctx.candidates.find(c=>String(c.id)===String(inPlayerId||''));
  if(!chosen)return toast('교체할 후보를 다시 확인해 주세요.');
  closeOfficialReplacePicker();
  if(ctx.kind==='queue')await sendOfficialQueueReplace(ctx.actorId,ctx.queueId,ctx.outId,chosen);
  else await sendOfficialActiveReplace(ctx.actorId,ctx.matchId,ctx.outId,chosen);
}
// 다음 대진 짜기(운영자 2026-08-10 "새 게임 등록은 다음 대진을 수동으로 짠다는
// 뜻"). 4명을 같은 편 두 명씩 순서대로 눌러 대기표 끝에 붙입니다. 순서는 카드의
// 위로/아래로 버튼으로 바꿉니다. 경기 중인 선수도 넣을 수 있고, 그 대진은 선수의
// 경기 종료까지 투입이 보류됩니다 — 임원 자유 + 시스템 사후 균형.
function openOfficialQueueCompose(actorId){
  const actor=officialActor(actorId);
  if(!actor)return toast('운영 권한을 다시 확인해 주세요.');

function _officialComposeRender(){
  const ctx=_officialReplaceCtx;
  if(!ctx||ctx.kind!=='compose')return;
  const rows=ctx.players.map(p=>{
    const at=ctx.picked.indexOf(p.id);
    return {...p,selected:at>=0,
      meta:at<0?p.meta:(at<2?`A팀 ${at+1}`:`B팀 ${at-1}`),
      playing:at<0&&p.playing,queued:at<0&&p.queued};
  });
  const head=document.getElementById('replacePickerTitle');
  if(head)head.textContent='다음 대진 짜기';
  const sub=document.getElementById('replacePickerSub');
  if(sub)sub.textContent=`같은 편 두 명씩 4명을 누르세요 (${ctx.picked.length}/4)`;
  const list=document.getElementById('replacePickerList');
  if(list){
    const row=c=>`<button type="button" class="replace-picker-row${c.selected?' selected':''}${c.queued?' queued':''}${c.playing?' playing':''}" onclick="pickOfficialReplaceCandidate('${esc(c.id)}')">
      <b>${esc(c.name)}</b><span>${esc(c.meta)}</span></button>`;
    // 예약현황(운영자 2026-08-10 실전 피드백 "현황이 안 보여"): 지금 대기표를
    // 위에 보여줍니다. 새로 짜는 대진은 이 목록의 맨 뒤에 붙습니다.
    const current=eventNextList().map((q,i)=>{
      const names=`${(q.t1||[]).join('·')} vs ${(q.t2||[]).join('·')}`;
      const waitingOn=(q.playerIds||[]).map(id=>(session?.players||[]).find(pp=>String(pp.id)===String(id)))
        .filter(pp=>pp&&(pp.status==='playing'||pp.currentMatchId)).map(pp=>pp.name);
      const tag=waitingOn.length?` · ${waitingOn.join('·')} 경기 종료 후`:(q.restPass?' · 일시정지':'');
      // 직접 짠 대진에는 딱지를 붙여 자동 편성과 구분합니다(운영자 2026-08-13).
      return `<div class="replace-picker-current"><b>${i+1}순위</b><span>${esc(names)}${esc(tag)}</span>${manualComposedBadge(q)}</div>`;
    }).join('');
    const st=list.scrollTop;
    list.innerHTML=`${current?`<div class="replace-picker-group">현재 다음 대진 — 새 대진은 ${eventNextList().length+1}순위로 추가</div>${current}`:''}
      <div class="replace-picker-group">처음 두 명이 A팀 · 경기중 선수는 경기 종료 후 투입</div>${rows.map(row).join('')}`;
    list.scrollTop=st;
  }
  document.getElementById('replacePicker')?.classList.remove('hidden');
}
async function _officialComposeToggle(id){
  const ctx=_officialReplaceCtx;
  if(!ctx||ctx.kind!=='compose')return;
  const at=ctx.picked.indexOf(id);
  if(at>=0)ctx.picked.splice(at,1);
  else if(ctx.players.some(p=>p.id===id))ctx.picked.push(id);
  if(ctx.picked.length<4)return _officialComposeRender();
  const picked=ctx.picked.map(pid=>ctx.players.find(p=>p.id===pid));
  const names=picked.map(p=>p?.name||'선수');
  const position=eventNextList().length+1;
  const playingNames=picked.filter(p=>p?.playing).map(p=>p.name);
  const queuedNames=picked.filter(p=>p?.queued).map(p=>p.name);
  // "몇 번째에 짜지는지 알림"(운영자 2026-08-10 실전 피드백) — 순번과 투입 조건을
  // 확인창과 완료 안내 양쪽에서 말해 줍니다. 회원들이 임원에게 묻는 내용입니다.
  const playingNote=playingNames.length
    ? `\n${playingNames.join(', ')} 선수가 경기 중이라, 그 경기 종료 후부터 투입 대상이 됩니다.`
    : '';
  // 대기 팀에서 데려온 자리는 팀 해체 없이 자동 보충됩니다(운영자 2026-08-11).
  // 중복 예약 경고(운영자 2026-08-13): 마무리 후 자율게임 신청이 겹칠 때,
  // 어느 대진을 건드리는지 순위까지 보여 줘야 임원이 판단할 수 있습니다.
  const queuedDetail=picked.filter(p=>p?.queued)
    .map(p=>`· ${p.name} — 현재 ${p.queueIdx?`${p.queueIdx}순위`:'다음 대진'}에 예약됨`);
  const queuedNote=queuedDetail.length
    ? `\n\n⚠ 이미 예약된 선수 ${queuedDetail.length}명이 있습니다\n${queuedDetail.join('\n')}\n`
      + `\n그대로 진행하면 이 선수는 새 대진으로 옮겨지고, 원래 팀은 순번을 지킨 채 빈 자리가 자동 보충됩니다.`
      + `\n보충할 대기 인원이 없으면 그 대진은 해체됩니다.`
    : '';
  // 완전히 같은 네 명이 이미 잡혀 있으면 중복 신청일 가능성이 큽니다.
  const sameFour=eventNextList().find(q=>{
    const ids=(q.playerIds||[...(q.t1Ids||[]),...(q.t2Ids||[])]).map(String).sort().join('|');
    return ids===[...ctx.picked].map(String).sort().join('|');
  });
  const sameFourNote=sameFour
    ? `\n\n⚠ 같은 네 명이 이미 ${eventNextList().indexOf(sameFour)+1}순위에 잡혀 있습니다 — 중복 신청일 수 있습니다.`
    : '';
  if(!confirm(`A팀 ${names[0]} · ${names[1]}\nB팀 ${names[2]} · ${names[3]}\n\n다음 대진 ${position}순위로 추가할까요?${playingNote}${queuedNote}${sameFourNote}`)){
    ctx.picked.pop();   // 마지막 선택만 되돌립니다 — 처음부터 다시 고르게 하지 않습니다
    return _officialComposeRender();
  }
  const actorId=ctx.actorId, ids=[...ctx.picked];
  closeOfficialReplacePicker();
  const actor=officialActor(actorId);
  if(!actor)return toast('운영 권한을 다시 확인해 주세요.');
  const now=Date.now();
  const operationId=createOfficialOperationId('queue-add');
  const ok=await pushOfficialRequest({
    type:'official-queue-add',
    operationId,
    actorPlayerId:actor.id,actorPlayerName:actor.name,
    queueId:`sq_${operationId}`,
    team1Ids:ids.slice(0,2),
    team2Ids:ids.slice(2,4),
    createdAt:now,expiresAt:now+OFFICIAL_OPERATION_TTL_MS,
    observedUpdatedAt:session.updatedAt||0,
    source:'club-official-queue-add'
  },`다음 대진 ${position}순위 추가`);
  if(ok)toast(playingNames.length
    ? `${position}순위로 추가 요청 · ${playingNames.join('·')} 경기 종료 후 투입`
    : `${position}순위로 추가 요청됐어요`);
}

      });
      if(deferred.queueId||deferred.id){
        const names=ids=>(ids||[]).map(id=>(session.players||[]).find(player=>player.id===id)?.name||'선수');

  }
  if(!db||!checkinId||!session||sendingKey)return;
  if(sessionExpired())return showEndedLink();
  const p=(session.players||[]).find(x=>x.id===playerId);
  if(!p)return toast('선수를 찾지 못했습니다.');
  if(p.locked||p.status==='playing')return toast('경기중에는 상태 변경이 잠겨 있어요. 경기 종료 후 선택해 주세요.');
  if(!confirmPlayerIdentity(p))return;
  if(isRapidStatusChange(p,status))return toast('상태 변경은 잠시 후 다시 눌러주세요.');
  if(!confirmStatusChange(p,status))return;

    return toast('방금 같은 상태를 전송했어요.');
  }
  sendingKey=playerId+'_'+status;
  render();
  const now=Date.now();
  const req={
    type:'member-player-status',
    operationId:createMemberStatusOperationId(),
    actorPlayerId:p.id,
    playerId:p.id,
    playerName:p.name,
    status,
    statusLabel:compactLabel(status),
    expectedStatus:p.status||'',
    expectedCurrentMatchId:p.currentMatchId||'',
    expectedLastStatusAt:Number(p.lastStatusAt||0),
    createdAt:now,
    expiresAt:now+5*60*1000,
    source:'member-checkin-server'
  };
  const pushLegacyStatusRequest=async()=>{
    const legacyReq={
      playerId:p.id,
      playerName:p.name,
      status,
      statusLabel:compactLabel(status),
      createdAt:Date.now(),
      source:'member-checkin'
    };
    await db.ref(checkinPath()+'/requests').push(legacyReq);
    setLastSent(legacyReq);
    return legacyReq;
  };
  try{
    if(memberStatusServerReady()){
      try{
        const callable=firebase.functions().httpsCallable('submitDailyMemberStatusRequest');
        const result=await callable({checkinId,command:req});
        const receipt=result?.data||{};
        if(receipt.status!=='applied'){
          toast(receipt.reason||'현재 상태에서 바로 처리할 수 없습니다.');
          return;
        }
        setLastSent(req);
        toast(`${p.name} · ${compactLabel(status)} 바로 반영`);

        // 전송 계층 실패에 한해 임원에게 가는 옛 요청 경로로 넘깁니다.
        // 상태 거절(권한·현재 상태 문제)은 되풀이해도 같은 결과라 그대로 알립니다.
        if(!memberStatusTransportFailure(callableError))throw callableError;
        await pushLegacyStatusRequest();
        toast(`${p.name} · ${compactLabel(status)} 요청 접수 (임원이 확인 후 반영)`);
      }
    }else{
      await pushLegacyStatusRequest();
      toast(`${p.name} · ${compactLabel(status)} 요청 접수`);
    }
  }catch(e){
    toast(memberStatusServerReady()?memberStatusCallableError(e):'전송에 실패했습니다. 잠시 후 다시 눌러주세요.');
  }finally{
    sendingKey='';
    render();
  }
}

    toast('종료 취소 요청을 보냈어요.');
  }catch(e){
    toast('종료 취소 요청에 실패했습니다.');
  }finally{
    sendingKey='';
    renderEvent();
  }
}
async function sendGameRequest(playerId){
  const p=(session?.players||[]).find(x=>x.id===playerId);
  toast(`${p?.name||'선수'}님의 파트너 요청은 클럽 임원이 현장에서 접수합니다.`);
}
async function sendReservationConsent(reqKey,playerId,accept){
  if(blockPausedOperation('게임신청을 처리'))return;
  if(!db||!checkinId||!session||sendingKey)return;
  if(sessionExpired())return showEndedLink();
  const req=reservationRequests.find(r=>r.key===reqKey);
  const p=(session.players||[]).find(x=>x.id===playerId);
  if(!req||!p)return toast('신청 정보를 찾지 못했습니다.');
  sendingKey=playerId+'_consent';
  render();
  try{
    const ref=db.ref(checkinPath()+'/requests/'+reqKey);
    if(accept){
      await ref.child('consents/'+playerId).set('accepted');
      req.consents={...(req.consents||{}),[playerId]:'accepted'};
      toast('동의 완료 · 모두 동의하면 예약됩니다.');
    }else{
      const reason=`${p.name}님이 게임신청을 거절했습니다.`;
      await ref.update({ignoredAt:Date.now(),ignoredBy:'member-reservation-decline',reason});
      req.ignoredAt=Date.now();
      req.reason=reason;
      toast('게임신청을 거절했습니다.');
    }
  }catch(e){
    toast('처리에 실패했습니다. 잠시 후 다시 눌러주세요.');
  }finally{
    sendingKey='';
    render();
  }
}
async function sendReservationCancel(reqKey,playerId){
  if(blockPausedOperation('게임신청을 취소'))return;
  if(isSampleMode()){
    if(!session||sendingKey)return;
    const req=reservationRequests.find(r=>r.key===reqKey);
    const p=(session.players||[]).find(x=>x.id===playerId);
    if(!req||!p)return toast('신청 정보를 찾지 못했습니다.');
    if(!confirm('이 게임신청을 취소할까요?\n필요하면 다시 신청할 수 있습니다.'))return;
    const reason=req.playerId===playerId
      ? `${p.name}님이 게임신청을 취소했습니다.`
      : `${p.name}님이 게임신청 동의를 취소했습니다.`;
    req.ignoredAt=Date.now();
    req.reason=reason;
    toast('게임신청을 취소했습니다.');
    render();
    return;
  }
  if(!db||!checkinId||!session||sendingKey)return;
  if(sessionExpired())return showEndedLink();
  const req=reservationRequests.find(r=>r.key===reqKey);
  const p=(session.players||[]).find(x=>x.id===playerId);
  if(!req||!p)return toast('신청 정보를 찾지 못했습니다.');
  if(!confirm('이 게임신청을 취소할까요?\n필요하면 다시 신청할 수 있습니다.'))return;
  sendingKey=playerId+'_reservation_cancel';
  render();
  try{
    const reason=req.playerId===playerId
      ? `${p.name}님이 게임신청을 취소했습니다.`
      : `${p.name}님이 게임신청 동의를 취소했습니다.`;
    await db.ref(checkinPath()+'/requests/'+reqKey).update({ignoredAt:Date.now(),ignoredBy:'member-reservation-cancel',reason});
    req.ignoredAt=Date.now();
    req.reason=reason;
    toast('게임신청을 취소했습니다.');
  }catch(e){
    toast('취소 처리에 실패했습니다.');
  }finally{
    sendingKey='';
    render();
  }
}
function boot(){
  const vEl=document.getElementById('appVersion');
  if(vEl)vEl.textContent='v'+APP_VERSION;
  const sampleMode=new URLSearchParams(location.search).has('sample');
  const officialLink=officialInviteFromSearch(location.search);
  checkinId=officialLink.checkinId||qs('id')||(sampleMode?'SAMPLE':'');
  if(!checkinId){
    document.getElementById('players').textContent='민턴LIVE 링크가 올바르지 않습니다.';
    return;
  }
  const inviteFromLink=officialLink.token;
  if(inviteFromLink&&/^[a-f0-9]{48}$/i.test(inviteFromLink)){
    pendingOfficialInvite=inviteFromLink;
    try{sessionStorage.setItem('kokmatch_pending_official_invite_'+checkinId,pendingOfficialInvite);}catch(e){}
  }else{
    try{pendingOfficialInvite=sessionStorage.getItem('kokmatch_pending_official_invite_'+checkinId)||'';}catch(e){}
  }
  officialGrantToken=loadOfficialGrant();
  if(sampleMode){
    session=sampleSession();
    if(qs('paused')==='1'){
      session.event.paused=true;
      session.event.pausedAt=Date.now();
      session.event.pauseReason='생일축하·공지';
    }
    partyResponses=['s2','s4','s6','s10','s13','s18'].reduce((rows,id)=>{
      rows[id]={attending:true,revision:1,updatedAt:Date.now(),source:'sample'};
      return rows;
    },{});
    const samplePlayerId=qs('player');
    const samplePlayer=(session.players||[]).find(p=>p.id===samplePlayerId);
    if(samplePlayer){
      setLastSent({
        playerId:samplePlayer.id,
        playerName:samplePlayer.name,
        status:samplePlayer.status,
        statusLabel:compactLabel(samplePlayer.status),
        source:'member-identity'
      });
    }
    render();
    if(eventTimer)clearInterval(eventTimer);
    eventTimer=setInterval(refreshLiveTimers,1000);
    return;
  }
  try{
    firebase.initializeApp(FB_CONFIG);
    db=firebase.database();
    resumeRealtimeConnection();
  }catch(e){
    document.getElementById('players').textContent='서버 연결에 실패했습니다.';
    return;
  }
  db.ref(checkinPath()+'/session').on('value',snap=>{
    session=snap.val();
    if(!session){
      renderEvent();
      const fold=document.getElementById('playerListFold');
      if(fold)fold.open=true;
      document.getElementById('sessionSub').textContent='종료된 민턴LIVE 링크입니다.';
      document.getElementById('players').className='empty';
      document.getElementById('players').textContent='관리자가 링크를 종료했거나 아직 명단을 공유하지 않았습니다.';
      return;
    }
    if(sessionExpired()){
      showEndedLink();
      return;
    }
    const selectedId=getLastSent()?.playerId||'';
    const selectedPlayer=(session.players||[]).find(player=>String(player.id||'')===String(selectedId));
    if(officialGrantPlayerId&&String(officialGrantPlayerId)===String(selectedId)&&selectedPlayer&&!isLiveOperatorPlayer(selectedPlayer)){
      clearOfficialGrant('운영 도우미 권한이 해제되었습니다.');
    }
    const official=selectedOfficialPlayer();
    if(official&&!officialServerReady()&&!officialGrantError)claimOfficialInvite(official);
    render();
  });
  db.ref(checkinPath()+'/requests').on('value',snap=>{
    const raw=snap.val()||{};
    const rows=Object.keys(raw).map(key=>({key,...raw[key]}));
    statusRequests=rows
      .filter(r=>!r.ignoredAt&&r.type!=='reservation'&&r.status)
      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    reservationRequests=rows
      .filter(r=>r.type==='reservation'&&(!r.ignoredAt||Date.now()-(r.ignoredAt||0)<10*60*1000))
      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    officialRequests=rows
      .filter(r=>String(r.type||'').startsWith('official-')&&Date.now()-Number(r.createdAt||0)<OFFICIAL_OPERATION_TTL_MS)
      .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    render();
  });
  db.ref(checkinPath()+'/party').on('value',snap=>{
    partyResponses=snap.val()||{};
    render();
  });
  db.ref(checkinPath()+'/operator').on('value',snap=>{
    operatorState=snap.val()||null;
    refreshOfficialConnection();
  });
  document.getElementById('search').addEventListener('input',e=>{
    query=e.target.value.trim();
    if(query)identityLookupOpen=true;
    const fold=document.getElementById('playerListFold');
    if(fold&&query)fold.open=true;
    render();
  });
  if(!eventTimer){
    eventTimer=setInterval(refreshLiveTimers,1000);
  }
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
      resumeRealtimeConnection();
      refreshLiveTimers();
    }
  });
  window.addEventListener('online',resumeRealtimeConnection);
  window.addEventListener('pageshow',resumeRealtimeConnection);
}
boot();
</script>
<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update().catch(()=>{});
      if(reg.waiting)reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            nw.postMessage&&nw.postMessage('skipWaiting');
          }
        });
      });
    }).catch(()=>{});
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible'){
        navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
      }
    });
  });
})();
</script>
