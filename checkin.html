<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f7f6">
<title>민턴LIVE 내 경기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8fc;--card:#fff;--line:#e3e9f3;--txt:#18202d;--mut:#6f7a8a;
  --blue:#5b8def;--blue2:#eaf1fe;--green:#35a56a;--red:#e35b55;--amber:#f0a73a;
  --shadow:0 18px 45px rgba(35,55,90,.12);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  background:linear-gradient(180deg,#edf4ff 0%,#f8fafc 46%,#fff 100%);
  color:var(--txt);
}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 34px}
.hero{
  padding:22px 18px;
  border:1px solid rgba(91,141,239,.22);
  border-radius:26px;
  background:linear-gradient(135deg,#ffffff 0%,#eef5ff 100%);
  box-shadow:var(--shadow);
}
.hero.hidden{display:none}
.eyebrow{font-size:13px;font-weight:900;color:#4f78c9;letter-spacing:.02em}
h1{margin:8px 0 8px;font-size:28px;line-height:1.18}
.sub{margin:0;color:var(--mut);font-size:15px;line-height:1.55}
.notice{
  margin:14px 0 0;
  padding:11px 13px;
  border-radius:18px;
  background:rgba(255,255,255,.8);
  border:1px solid var(--line);
  color:#344055;
  font-size:13px;
  line-height:1.5;
}
.last-sent{
  margin:12px 0 0;
  padding:11px 13px;
  border-radius:17px;
  border:1px solid #bbf7d0;
  background:#f0fdf4;
  color:#166534;
  font-size:14px;
  font-weight:900;
  line-height:1.45;
}
.last-sent b{color:#0f5132}
.last-sent.hidden{display:none}
.vote-summary{
  margin:12px 0 0;
  display:grid;
  grid-template-columns:1.35fr repeat(2,minmax(0,.88fr));
  gap:7px;
}
.vote-chip{
  padding:9px 8px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.82);
  text-align:center;
}
.vote-chip b{display:block;font-size:18px;line-height:1;color:#315fb2}
.vote-chip span{display:block;margin-top:4px;font-size:11px;font-weight:900;color:var(--mut)}
.vote-chip.total{
  text-align:left;
  padding:11px 12px;
  background:linear-gradient(135deg,#eef5ff 0%,#fff 100%);
  border-color:#bfdbfe;
}
.vote-chip.total b{font-size:24px;color:#315fb2}
.vote-chip.total span{font-size:12px;color:#4f78c9}
.vote-chip.ready{border-color:#bbf7d0;background:#f0fdf4}
.vote-chip.ready b{color:#16834f}
.vote-chip.warn{border-color:#fed7aa;background:#fff7ed}
.vote-chip.warn b{color:#b45309}
.vote-summary.hidden{display:none}
.panel{
  margin-top:16px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.86);
  box-shadow:0 10px 28px rgba(35,55,90,.08);
}
.event-panel.hidden{display:none}
.event-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.event-title b{font-size:18px}
.event-title span{font-size:12px;color:var(--mut);font-weight:900}
.event-score{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:stretch;
  margin-bottom:10px;
}
.event-team{
  padding:12px 10px;
  border-radius:18px;
  border:1px solid rgba(91,141,239,.24);
  background:#eef5ff;
  text-align:center;
}
.event-team.red{border-color:#ffd3cf;background:#fff1f0}
.event-team span{display:block;font-size:12px;color:var(--mut);font-weight:900}
.event-team b{display:block;margin-top:4px;font-size:32px;line-height:1;color:#315fb2}
.event-team.red b{color:#bd3b35}
.event-vs{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:900}
.event-chip{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:999px;
  background:#f2f5fa;
  color:#4b5668;
  font-size:12px;
  font-weight:900;
  margin:0 5px 6px 0;
}
.event-chip.gold{background:#fff5df;color:#9a610b}
.event-section-title{
  margin:10px 0 6px;
  font-size:12px;
  font-weight:900;
  color:#6b7280;
}
.event-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.event-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
}
.event-row-main{
  min-width:0;
  flex:1;
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:10px;
  align-items:center;
}
.event-row-main.full{grid-template-columns:minmax(0,1fr)}
.event-court-badge{
  min-width:62px;
  min-height:54px;
  padding:8px 9px;
  border-radius:16px;
  background:#eaf1fe;
  color:#315fb2;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:900;
  line-height:1;
}
.event-court-badge b{font-size:23px;line-height:1}
.event-court-badge span{font-size:12px;margin-top:4px}
.event-row.next .event-court-badge{background:#edf7ff;color:#2563eb}
.event-row.soon .event-court-badge,.event-row.due .event-court-badge{background:#fee2e2;color:#b91c1c}
.event-match-title{
  font-size:15px;
  font-weight:900;
  color:#273244;
  line-height:1.25;
  margin-bottom:5px;
}
.event-match-heading{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}
.event-match-heading .event-match-title{margin-bottom:0}
.event-partner-badge{
  display:inline-flex;
  align-items:center;
  width:max-content;
  padding:3px 8px;
  border:1px solid #b8dec9;
  border-radius:999px;
  background:#eef8f3;
  color:#176347;
  font-size:11px;
  font-weight:1000;
  line-height:1.2;
  white-space:nowrap;
}
.event-partner-badge.correction{margin-left:5px;border-color:#f1cf8b;background:#fff8e8;color:#946000;}
.event-row .event-partner-badge{margin-bottom:5px}
.event-match-heading .event-partner-badge{margin-bottom:0}
.event-teams{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.event-teamline{
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:900;
  color:#111827;
  line-height:1.28;
  letter-spacing:-.02em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.event-team-player{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.event-teamline.b{color:#374151}
.event-teams.active-teams{
  display:block;
  min-width:0;
}
.event-active-line{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);
  align-items:center;
  gap:8px;
}
.event-active-pair{
  min-width:0;
  display:grid;
  gap:2px;
  justify-items:center;
  padding:7px 6px;
  border:1px solid rgba(91,141,239,.22);
  border-radius:15px;
  background:#f8fbff;
}
.event-active-pair.b{
  border-color:#dbe4f2;
  background:#fff;
}
.event-active-player{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#111827;
  font-size:16px;
  font-weight:1000;
  line-height:1.18;
  letter-spacing:-.035em;
}
.event-active-plus{
  color:#7a8798;
  font-size:10px;
  font-weight:1000;
  line-height:1;
}
.event-active-vs{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:#f2f5fb;
  color:#7a8798;
  font-style:normal;
  font-size:11px;
  font-weight:1000;
  line-height:1;
  text-transform:uppercase;
}
.event-row.next{
  border-color:#bfdbfe;
  background:linear-gradient(135deg,#f8fbff 0%,#fff 100%);
}
.event-row.next:first-child{
  border-color:#5b8def;
  box-shadow:0 8px 20px rgba(91,141,239,.14);
}
.event-row.soon,.event-row.due{
  border-color:#fecaca;
  background:#fff7f7;
}
.event-row strong{display:block;font-size:15px}
.event-row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.event-row .event-cue{color:#315fb2;font-weight:900}
.event-row.due .event-cue,.event-row.soon .event-cue{color:#b91c1c}
.event-row em{
  flex-shrink:0;
  font-style:normal;
  font-size:13px;
  font-weight:900;
  color:#4f78c9;
  background:#eaf1fe;
  border-radius:999px;
  padding:8px 10px;
  align-self:center;
  white-space:nowrap;
}
.event-active-meta{
  flex:0 0 92px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  gap:7px;
}
.event-active-meta em{align-self:stretch;text-align:center;}
.event-official-complete{
  min-height:40px;
  border:1.5px solid #e3a7aa;
  border-radius:8px;
  background:#fff4f4;
  color:#b42318;
  padding:7px 8px;
  font:inherit;
  font-size:12px;
  font-weight:1000;
  cursor:pointer;
}
.event-official-complete:disabled{opacity:.42;cursor:not-allowed;}
.event-official-active-yield{
  width:100%;
  min-height:44px;
  border:1.5px solid #f59e0b;
  border-radius:8px;
  background:#fff7e8;
  color:#9a5800;
  padding:5px 6px;
  font:inherit;
  font-size:11px;
  font-weight:1000;
  line-height:1.15;
  word-break:keep-all;
  cursor:pointer;
}
.event-official-active-yield small{display:block;margin-top:2px;color:#b46b00;font-size:9px;}
.event-official-active-yield:disabled{opacity:.42;cursor:not-allowed;}
.event-complete-action{
  margin-top:9px;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.event-complete-btn,.event-undo-btn{
  width:100%;
  border:1.5px solid #bfdbfe;
  border-radius:14px;
  padding:12px 13px;
  background:#eef5ff;
  color:#315fb2;
  font-size:15px;
  font-weight:1000;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(91,141,239,.12);
}
.event-complete-btn.due,.event-complete-btn.soon{
  border-color:#fecaca;
  background:#fff1f2;
  color:#b91c1c;
}
.event-undo-btn{
  border-color:#fed7aa;
  background:#fff7ed;
  color:#9a610b;
}
.event-row.soon em,.event-row.due em{
  color:#fff;
  background:#dc2626;
  animation:eventPulse 1.2s ease-in-out infinite;
}
@keyframes eventPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.22)}
  50%{box-shadow:0 0 0 6px rgba(220,38,38,.08)}
}
@media(max-width:430px){
  .event-row{padding:11px 10px;gap:8px}
  .event-row-main{grid-template-columns:auto minmax(0,1fr);gap:8px}
  .event-court-badge{min-width:56px;min-height:50px;border-radius:14px}
  .event-court-badge b{font-size:21px}
  .event-teamline{font-size:17px}
  .event-active-line{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:6px}
  .event-active-pair{padding:6px 5px;border-radius:14px}
  .event-active-player{font-size:15px}
  .event-active-player.replaceable{padding:2px 3px}
  .event-active-vs{width:28px;height:28px;font-size:10px}
  .event-row em{font-size:12px;padding:7px 8px}
  .event-active-meta{flex-basis:82px;gap:6px}
  .event-official-complete{min-height:38px;padding:6px 5px;font-size:11px}
}
@media(max-width:370px){
  .event-row.event-active{flex-wrap:wrap}
  .event-row.event-active .event-row-main{flex:1 1 100%}
  .event-row.event-active .event-active-meta{
    flex:1 1 100%;
    display:grid;
    grid-template-columns:minmax(0,1fr);
  }
  .event-row.event-active .event-active-meta em:only-child{grid-column:1/-1}
}
.toolbar{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:12px;
}
.panel.hidden{display:none}
.member-fold{
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  overflow:hidden;
}
.member-fold summary{
  cursor:pointer;
  list-style:none;
  padding:13px 14px;
  font-size:15px;
  font-weight:900;
  color:#344055;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.member-fold summary::-webkit-details-marker{display:none}
.member-fold summary:after{
  content:'보기';
  flex-shrink:0;
  font-size:12px;
  color:#4f78c9;
  background:#eaf1fe;
  border-radius:999px;
  padding:5px 9px;
}
.member-fold[open] summary{border-bottom:1px solid var(--line)}
.member-fold[open] summary:after{content:'접기'}
.member-fold #players{padding:0 10px 10px}
.my-card-wrap{margin-bottom:12px}
.my-card-wrap.hidden{display:none}
.my-card{
  border:1.5px solid #c8dbfb;
  border-radius:24px;
  background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);
  box-shadow:0 14px 34px rgba(35,55,90,.085);
  padding:17px;
}
.my-card-head{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.my-card-info{min-width:0;flex:1}
.my-card-change{
  flex-shrink:0;
  min-height:42px;
  padding:0 14px;
  border:1.5px solid #d8e2ef;
  border-radius:999px;
  background:#fff;
  color:#4f78c9;
  font-size:13px;
  font-weight:1000;
  box-shadow:none;
}
.my-avatar{
  width:58px;height:58px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  background:#eaf1fe;color:#315fb2;border:1px solid #bfdbfe;
  font-size:23px;font-weight:1000;flex-shrink:0;
}
.my-card-name{font-size:24px;font-weight:1000;letter-spacing:-.055em;line-height:1.16;color:#18202d}
.my-card-state{font-size:13px;font-weight:1000;color:#16834f;margin-top:5px}
.my-status-chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}
.my-status-chip{
  display:inline-flex;
  align-items:center;
  min-height:28px;
  padding:6px 9px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--mut);
  font-size:12px;
  font-weight:1000;
  line-height:1;
  white-space:nowrap;
}
.my-status-chip.on{
  border-color:#cfeeda;
  background:#f4fbf7;
  color:#3f7c58;
  box-shadow:0 0 0 4px rgba(145,209,170,.12);
}
.my-status-chip.warn{
  border-color:#ead2a8;
  background:#fff9ef;
  color:#8c672b;
}
.my-action-panel{border:1px solid #e3eaf5;border-radius:22px;background:#fff;padding:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.8);}
.my-card .game-request{margin-top:10px}
.my-current-match{
  margin-bottom:10px;
  padding:13px;
  border:1.5px solid #f1cdcf;
  border-radius:18px;
  background:#fff7f7;
  color:#712b31;
}
.my-current-match-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.my-current-match-head span{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:1000;
}
.my-current-match-head span:before{
  content:'';
  width:9px;
  height:9px;
  border-radius:50%;
  background:#dc3545;
  box-shadow:0 0 0 4px rgba(220,53,69,.12);
  flex-shrink:0;
}
.my-current-match-head b{
  font-size:16px;
  color:#b42331;
}
.my-current-match-teams{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);
  gap:8px;
  margin-top:11px;
}
.my-current-match-team{
  min-width:0;
  padding:9px 10px;
  border:1px solid #f4dfe1;
  border-radius:13px;
  background:#fff;
}
.my-current-match-team small{
  display:block;
  margin-bottom:3px;
  color:#9b6a70;
  font-size:11px;
  font-weight:900;
}
.my-current-match-team strong{
  display:block;
  color:#263041;
  font-size:14px;
  line-height:1.35;
  overflow-wrap:anywhere;
}
.my-current-match-time{
  margin-top:8px;
  color:#8f444b;
  font-size:12px;
  font-weight:900;
  text-align:right;
}
.my-current-match>.event-partner-badge{margin-top:8px}
.next-queue-notice{
  margin-top:10px;
  padding:12px 13px;
  border-radius:18px;
  border:1.5px solid #c8dbfb;
  background:linear-gradient(135deg,#f8fbff 0%,#fff 100%);
  color:#315fb2;
  font-size:14px;
  font-weight:1000;
  line-height:1.45;
}
.next-queue-headline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.next-queue-title{display:block}
.next-queue-headline .event-partner-badge{margin:0}
.next-queue-notice small{
  display:block;
  margin-top:3px;
  color:#6f7a8a;
  font-size:12px;
  font-weight:900;
}
.queue-defer-btn{
  margin-top:9px;
  width:100%;
  min-height:44px;
  border-radius:15px;
  border:1.5px solid #ead2a8;
  background:#fff9ef;
  color:#8c672b;
  font-weight:1000;
  font-size:15px;
  font-family:inherit;
  letter-spacing:-.03em;
}
.queue-defer-btn:active{transform:translateY(1px);}
.queue-entry-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px;
}
.queue-entry-actions.member-rest-only{grid-template-columns:1fr;}
.queue-enter-btn,.queue-rest-btn{
  min-height:42px;
  border-radius:15px;
  font-weight:1000;
  font-size:14px;
}
.queue-enter-btn{
  border:1.5px solid #bcd4fb;
  background:#f4f8ff;
  color:#315fb2;
}
.queue-rest-btn{
  border:1.5px solid #cfeeda;
  background:#f4fbf7;
  color:#3f7c58;
}
.queue-enter-btn:active,.queue-rest-btn:active{transform:translateY(1px);}
.rest-guide{
  margin-top:10px;
  padding:12px 13px;
  border-radius:18px;
  border:1.5px solid #d6eadf;
  background:#f4fbf7;
  color:#23754a;
  font-size:14px;
  font-weight:1000;
  line-height:1.45;
}
.rest-guide small{
  display:block;
  margin-top:3px;
  color:#6f7a8a;
  font-size:12px;
  font-weight:900;
}
.pick-guide{
  border:1px dashed #c8dbfb;border-radius:20px;padding:14px;
  background:#f8fbff;color:#4f78c9;font-size:14px;font-weight:900;line-height:1.5;
}
.other-roster-title{margin:12px 0 8px;color:#6f7a8a;font-size:12px;font-weight:1000;letter-spacing:.04em}
.version-chip{
  display:none;
  align-items:center;
  justify-content:center;
  margin-top:10px;
  padding:5px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(255,255,255,.76);
  color:#8a94a5;
  font-size:11px;
  font-weight:900;
  line-height:1;
}
.search{
  flex:1;
  height:46px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:16px;
  font-size:16px;
  background:#fff;
}
.pill{
  padding:9px 12px;
  border-radius:999px;
  background:var(--blue2);
  color:#406fc7;
  font-weight:900;
  font-size:13px;
  white-space:nowrap;
}
.player{
  padding:14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#fff;
  margin-top:10px;
}
.player.locked{border-color:#f3cf8f;background:#fffaf0}
.player.recent{border-color:#9bd7ff;box-shadow:0 0 0 4px rgba(91,141,239,.14)}
.phead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  margin-bottom:10px;
}
.name{font-size:18px;font-weight:900}
.meta{color:var(--mut);font-size:13px;margin-top:3px}
.badge{
  padding:7px 10px;
  border-radius:999px;
  background:#f2f5fa;
  color:#4b5668;
  font-weight:900;
  font-size:12px;
  white-space:nowrap;
}
.badge.selected{background:#eaf1fe;color:#315fb2}
.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.main-actions{margin-top:10px;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.my-action-panel .main-actions{margin-top:0;gap:8px}
.status-section{
  margin-top:9px;
  border:1px solid var(--line);
  border-radius:17px;
  background:#fbfcff;
  overflow:hidden;
}
.status-section.active{
  border-color:#9bd7ff;
  background:#f4f8ff;
  box-shadow:0 0 0 3px rgba(91,141,239,.10);
}
.status-section summary{
  cursor:pointer;
  padding:11px 12px;
  font-size:14px;
  font-weight:900;
  color:#344055;
  list-style:none;
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
}
.status-section summary::-webkit-details-marker{display:none}
.status-section summary small{
  color:var(--mut);
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
}
.compact-actions{
  padding:0 12px 12px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.game-request{
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fbfcff;
  overflow:hidden;
}
.game-request summary{
  cursor:pointer;
  padding:11px 12px;
  font-size:14px;
  font-weight:900;
  color:#344055;
  list-style:none;
}
.game-request summary::-webkit-details-marker{display:none}
.request-body{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.request-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.request-field label{font-size:12px;font-weight:900;color:var(--mut);padding-left:2px}
.request-field.full{grid-column:1/-1}
.request-help{
  grid-column:1/-1;
  color:var(--mut);
  font-size:12px;
  font-weight:900;
  line-height:1.45;
}
.request-body select,.request-body input{
  height:42px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 10px;
  font:inherit;
  background:#fff;
  min-width:0;
}
.request-body input{grid-column:1/-1}
.request-body button{grid-column:1/-1;background:var(--blue);color:#fff}
.request-status{
  margin:0 12px 12px;
  padding:10px 11px;
  border-radius:14px;
  border:1px solid #bfdbfe;
  background:#eff6ff;
  color:#1d4ed8;
  font-size:13px;
  font-weight:900;
  line-height:1.45;
}
.request-status.done{
  border-color:#bbf7d0;
  background:#f0fdf4;
  color:#166534;
}
.request-status.consent{
  border-color:#fed7aa;
  background:#fff7ed;
  color:#9a5b08;
}
.request-status.cancelled{
  border-color:#fed7aa;
  background:#fff7ed;
  color:#9a3412;
}
.request-status small{display:block;margin-top:3px;color:inherit;opacity:.72;font-size:12px;font-weight:800}
.request-chip{
  display:inline-flex;
  align-items:center;
  margin:0 5px 2px 0;
  padding:4px 7px;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  border:1px solid currentColor;
  color:inherit;
  font-size:10px;
  font-weight:1000;
  line-height:1;
  vertical-align:middle;
}
.request-consent-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.request-consent-actions button{padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--txt);font-weight:1000}
.request-consent-actions button.accept{border-color:#bdebd0;background:#eefbf4;color:#167244}
.request-consent-actions button.decline{border-color:#f4c7ce;background:#fff5f6;color:#a33b47}
button{
  appearance:none;
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 10px;
  font:inherit;
  font-weight:900;
  background:#fff;
  color:#273246;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  min-height:52px;
  transition:.15s ease;
}
button small{display:block;font-size:11px;font-weight:700;line-height:1.25;color:rgba(39,50,70,.62)}
button.primary small{color:rgba(255,255,255,.82)}
button:disabled{opacity:.55}
button.active{
  background:linear-gradient(135deg,#35c978,#159456);
  color:#fff;
  border-color:#14864e;
  box-shadow:0 9px 22px rgba(21,148,86,.28);
}
button.active small{color:rgba(255,255,255,.86)}
button.sent:not(.applied){background:linear-gradient(135deg,#35a56a,#1e7b4b);border-color:#187347;color:#fff}
.status-icon{display:block;font-size:16px;line-height:1;margin-bottom:3px;opacity:.88}
.main-actions .status-btn{min-height:54px;font-size:16px;}
.main-actions .status-btn span{font-size:16px;}
.my-action-panel .status-btn{
  min-height:74px;
  border-radius:20px;
  border:1.5px solid #d8e2ef;
  background:#fff;
  color:#344055;
  box-shadow:0 8px 18px rgba(35,55,90,.045);
}
.my-action-panel .status-btn.active{
  background:linear-gradient(135deg,#35c978,#159456);
  color:#fff;
  border-color:#159456;
  box-shadow:0 10px 24px rgba(21,148,86,.25);
}
.my-action-panel .status-btn.sent:not(.applied){
  background:linear-gradient(135deg,#5b8def,#4778d8);
  border-color:#4778d8;
  color:#fff;
}
.my-action-panel .status-btn span:last-child{font-size:17px;font-weight:1000;letter-spacing:-.02em}
.empty{
  padding:28px 14px;
  text-align:center;
  color:var(--mut);
  line-height:1.55;
}
.toast{
  position:fixed;
  left:14px;right:14px;bottom:16px;
  max-width:680px;margin:0 auto;
  padding:14px 16px;
  border-radius:18px;
  background:#18202d;
  color:#fff;
  font-weight:900;
  text-align:center;
  box-shadow:0 16px 44px rgba(0,0,0,.26);
  transform:translateY(120%);
  transition:.22s ease;
  z-index:10;
}
.toast.show{transform:translateY(0)}
@media (min-width:620px){.buttons:not(.main-actions){grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.request-body,.compact-actions{grid-template-columns:1fr}.vote-summary{grid-template-columns:1.15fr repeat(2,minmax(0,.8fr));gap:5px}.vote-chip{padding:8px 5px}.vote-chip.total{padding:9px 10px}.vote-chip.total b{font-size:22px}.vote-chip b{font-size:16px}.vote-chip span{font-size:10px}}

/* ── 민턴LIVE calm design layer: 가안 톤 적용 ── */
:root{
  --bg:#f7f9fd;--card:#fff;--line:#e4ebf5;--txt:#263041;--mut:#7a8494;
  --blue:#7fa8ee;--blue2:#f3f7ff;--green:#91d1aa;--red:#e99da1;--amber:#c99a58;
  --blue-deep:#436eb8;--green-deep:#3f7c58;--red-deep:#a85f63;--amber-soft:#fff9ef;
  --shadow:0 14px 34px rgba(35,55,90,.075);
}
body{
  background:linear-gradient(180deg,#fff 0%,#f1f6ff 260px,#f7f9fd 100%);
  color:var(--txt);
}
.wrap{max-width:430px;padding:18px 14px 38px;}
.hero,
.panel,
.my-card,
.member-fold,
.player,
.event-row{
  border-color:var(--line);
  border-radius:24px;
  background:rgba(255,255,255,.93);
  box-shadow:var(--shadow);
}
.hero{
  background:rgba(255,255,255,.92);
  padding:18px 16px;
}
.eyebrow{
  display:none;
  color:var(--blue-deep);
  letter-spacing:.14em;
}
h1{color:var(--txt);letter-spacing:-.055em;}
.sub,
.notice,
.event-title span,
.event-chip,
.event-section-title,
.meta,
.member-fold summary,
.event-row small{color:var(--mut);}
.notice{
  border-color:var(--line);
  background:#fbfdff;
  border-radius:18px;
}
.last-sent{
  border-color:#cfeeda;
  background:#f4fbf7;
  color:var(--green-deep);
  box-shadow:none;
}
.vote-chip{
  border-color:var(--line);
  border-radius:18px;
  background:#fbfdff;
}
.vote-chip.total{
  border-color:#c8dbfb;
  background:var(--blue2);
}
.vote-chip b,
.vote-chip.total b,
.event-court-badge,
.event-row .event-cue{color:var(--blue-deep);}
.vote-chip.total span{color:var(--blue-deep);}
.vote-chip.ready{
  border-color:#cfeeda;
  background:#f4fbf7;
}
.vote-chip.ready b{color:var(--green-deep);}
.vote-chip.warn{
  border-color:#ead2a8;
  background:var(--amber-soft);
}
.vote-chip.warn b{color:#8c672b;}
.panel{background:rgba(255,255,255,.92);}
.event-team{
  border-color:#c8dbfb;
  background:var(--blue2);
}
.event-team.red{
  border-color:#f1cdcf;
  background:#fff7f7;
}
.event-team b{color:var(--blue-deep);}
.event-team.red b{color:var(--red-deep);}
.event-row{
  box-shadow:none;
  border-radius:20px;
}
.event-row.next{
  border-color:#d9e6fb;
  background:linear-gradient(180deg,#fff,#f7faff);
}
.event-row.next:first-child{
  border-color:#c8dbfb;
  box-shadow:0 0 0 3px rgba(127,168,238,.10);
}
.event-row.soon,
.event-row.due{
  border-color:#f0d7aa;
  background:var(--amber-soft);
}
.event-court-badge{
  background:var(--blue2);
  border:1px solid #c8dbfb;
}
.event-row.next .event-court-badge{background:var(--blue2);color:var(--blue-deep);}
.event-row.soon .event-court-badge,
.event-row.due .event-court-badge{
  background:#fff7f7;
  border-color:#f1cdcf;
  color:var(--red-deep);
}
.event-teamline,
.event-match-title{color:var(--txt);}
.event-teamline.b{color:#4b5565;}
.event-row em{
  background:var(--blue2);
  color:var(--blue-deep);
}
.event-row.soon em,
.event-row.due em{
  background:#fff7f7;
  border:1px solid #f1cdcf;
  color:var(--red-deep);
  animation:none;
}
.event-complete-btn,
.event-undo-btn,
.status-btn,
.btn{
  border-radius:18px;
  box-shadow:none;
}
.event-complete-btn{
  border-color:#c8dbfb;
  background:var(--blue2);
  color:var(--blue-deep);
}
.event-complete-btn.due,
.event-complete-btn.soon{
  border-color:#f1cdcf;
  background:#fff7f7;
  color:var(--red-deep);
}
.event-undo-btn{
  border-color:#ead2a8;
  background:var(--amber-soft);
  color:#8c672b;
}
.my-card{
  border-color:#c8dbfb;
  background:linear-gradient(180deg,#fff 0%,#f7faff 100%);
  padding:18px 16px;
}
.my-avatar{
  background:var(--blue2);
  color:var(--blue-deep);
  border-color:#c8dbfb;
}
.my-card-name{color:var(--txt);}
.my-card-state{color:var(--green-deep);}
.my-action-panel{
  border-color:var(--line);
  background:#fff;
  border-radius:22px;
}
.status-btn{
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--mut);
}
.status-btn.active,
.status-btn.applied{
  border-color:var(--green);
  background:#f4fbf7;
  color:var(--green-deep);
  box-shadow:0 0 0 4px rgba(145,209,170,.14);
}
.status-btn.sent:not(.applied){
  border-color:#c8dbfb;
  background:var(--blue2);
  color:var(--blue-deep);
}
.status-section{
  border-color:var(--line);
  border-radius:18px;
  background:#fbfdff;
}
.status-section.active{
  border-color:#c8dbfb;
  background:var(--blue2);
  box-shadow:0 0 0 3px rgba(127,168,238,.10);
}
.member-fold summary:after{
  background:var(--blue2);
  color:var(--blue-deep);
}
.search{
  border-color:var(--line);
  border-radius:18px;
  background:#fff;
  color:var(--txt);
}
.pill{
  background:var(--blue2);
  color:var(--blue-deep);
}
.player{
  border-radius:20px;
  box-shadow:none;
}
.player.locked{
  border-color:#ead2a8;
  background:var(--amber-soft);
}
.player.recent{
  border-color:#c8dbfb;
  box-shadow:0 0 0 4px rgba(127,168,238,.12);
}
.player.selectable{
  cursor:pointer;
  border-color:#c8dbfb;
  background:linear-gradient(180deg,#fff 0%,#f7fbff 100%);
}
.player.selectable:active{
  transform:scale(.992);
}
.player.selectable .badge{
  border-color:#c8dbfb;
  background:var(--blue2);
  color:var(--blue-deep);
}
.select-hint{
  margin-top:10px;
  color:var(--blue-deep);
  font-size:.82rem;
  font-weight:1000;
}
.badge.selected,
.request-status.done{
  background:var(--blue2);
  color:var(--blue-deep);
}
.request-status.done.waiting-player{
  border-color:#fed7aa;
  background:#fff7ed;
  color:#9a5b08;
}
.request-status.done.blocked{
  border-color:#e5e7eb;
  background:#f8fafc;
  color:#475569;
}
.request-status.cancelled{
  background:#fff7f7;
  color:var(--red-deep);
}
.toast{
  background:#263041;
  box-shadow:0 16px 44px rgba(35,48,65,.22);
}

/* 민턴LIVE 회원페이지: 내 상태 우선 + 다음 대진 압축형 */
.my-card-wrap{
  margin:12px 0 14px;
}
.event-panel{
  margin-top:14px;
}
.event-title{
  margin-bottom:8px;
}
.event-title b{
  color:var(--txt);
  letter-spacing:-.04em;
}
.event-pause-banner{
  margin:10px 0 12px;
  padding:13px 14px;
  border:1.5px solid #efb1b5;
  border-radius:8px;
  background:#fff1f2;
  color:#9f2630;
}
.event-pause-banner strong{display:block;font-size:16px;line-height:1.3;}
.event-pause-banner span{display:block;margin-top:4px;font-size:12px;font-weight:900;line-height:1.5;}
.event-row.next{
  border-color:#cfeeda;
  background:linear-gradient(180deg,#fff 0%,#f7fcf9 100%);
  border-radius:20px;
  padding:11px 12px;
}
.event-row.next:first-child{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(145,209,170,.13);
}
.event-row.next.soon,
.event-row.next.due{
  border-color:#f1cdcf;
  background:#fff7f7;
}
.event-row.finish{border-color:#bbf7d0;background:#f0fdf4;}
.event-row.finish .event-cue{color:#166534;}
.event-row.next .event-row-main{
  grid-template-columns:auto minmax(0,1fr);
  gap:10px;
}
.event-rank-badge{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid var(--green);
  border-radius:999px;
  background:#f4fbf7;
  color:var(--green-deep);
  font-size:.92rem;
  font-weight:1000;
  line-height:1;
}
.event-row.next.soon .event-rank-badge,
.event-row.next.due .event-rank-badge{
  border-color:#f1cdcf;
  background:#fff1f1;
  color:var(--red-deep);
}
.next-teams{
  display:block;
}
.event-next-line{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);
  align-items:center;
  gap:8px;
  white-space:nowrap;
  color:var(--txt);
  font-size:.93rem;
  font-weight:1000;
  line-height:1.25;
  letter-spacing:-.055em;
}
.event-next-pair{
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:center;
  gap:8px;
}
.event-next-pair.a .event-next-player{text-align:right;}
.event-next-pair.b .event-next-player{text-align:left;}
.event-next-player{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.event-dot{
  display:none;
}
.event-next-line em{
  margin:0;
  color:var(--mut);
  font-style:normal;
  font-size:.64rem;
  font-weight:1000;
  text-transform:lowercase;
  text-align:center;
}
.event-row.next .event-complete-action{
  margin-top:8px;
}
.event-row.next .event-complete-action.split{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.event-row.next .event-complete-btn{
  min-height:44px;
  border-color:#cfeeda;
  background:#f4fbf7;
  color:var(--green-deep);
}
.event-row.next .event-rest-btn{
  min-height:44px;
  border:1.5px solid #ead2a8;
  border-radius:14px;
  background:#fff9ef;
  color:#8c672b;
  font-weight:1000;
}
.event-official-queue-actions{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:10px;
}
.event-official-queue-actions.split{grid-template-columns:repeat(2,minmax(0,1fr));}
.event-official-queue-actions button{
  min-width:0;
  min-height:44px;
  border-radius:8px;
  padding:8px 10px;
  font:inherit;
  font-size:13px;
  font-weight:1000;
  cursor:pointer;
}
.event-official-enter{
  border:1.5px solid #2f9168;
  background:#2f9168;
  color:#fff;
}
.event-official-yield{
  border:1.5px solid #e0b76a;
  background:#fff8e8;
  color:#83570e;
}
.event-official-queue-actions button:disabled{opacity:.42;cursor:not-allowed;}
.event-wait-pill{
  display:inline-flex;
  width:100%;
  min-height:34px;
  align-items:center;
  justify-content:center;
  border:1.5px solid #cfeeda;
  border-radius:14px;
  background:#f4fbf7;
  color:var(--green-deep);
  font-size:12px;
  font-weight:1000;
}
.event-row.expected{
  border-style:dashed;
  border-color:#d6eadf;
  background:#fbfffd;
  box-shadow:none;
}
.event-row.expected:first-child{
  border-color:#d6eadf;
  box-shadow:none;
}
.event-row.expected .event-rank-badge{
  border-color:#d6eadf;
  background:#f4fbf7;
  color:#3f7c58;
}
.event-row.expected .event-cue{
  display:block;
  margin-top:4px;
  color:#7a8798;
  font-size:.74rem;
  font-weight:900;
  line-height:1.35;
}
.event-row.next.soon .event-complete-btn,
.event-row.next.due .event-complete-btn{
  border-color:#f1cdcf;
  background:#fff7f7;
  color:var(--red-deep);
}
.event-section-title{
  color:#8792a2;
  letter-spacing:-.02em;
}
.event-row:not(.next){
  border-color:#d9e6fb;
  background:#fbfdff;
}
.event-row.soon:not(.next),
.event-row.due:not(.next){
  border-color:#ead2a8;
  background:var(--amber-soft);
}
@media(max-width:370px){
  .event-next-line{
    grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);
    gap:6px;
    font-size:.88rem;
  }
  .event-next-line em{
    margin:0;
    line-height:.9;
  }
  .event-next-player{
    min-width:0;
  }
}
.complete-picker-backdrop{
  position:fixed;
  inset:0;
  z-index:80;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:18px;
  background:rgba(21,30,43,.42);
  backdrop-filter:blur(8px);
}
.complete-picker-backdrop.hidden{display:none}
.complete-picker{
  width:min(540px,100%);
  border:1px solid var(--line);
  border-radius:28px;
  background:#fff;
  box-shadow:0 22px 70px rgba(24,39,64,.22);
  padding:18px;
}
.complete-picker-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.complete-picker-head b{
  display:block;
  font-size:1.15rem;
  color:var(--txt);
  letter-spacing:-.04em;
}

.official-support{margin-top:16px;padding-top:14px;border-top:2px solid #d9e5df;}
.official-support-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
.official-support-head b{font-size:16px;color:var(--txt);}
.official-connection{flex-shrink:0;padding:5px 9px;border-radius:999px;background:#eef9f3;color:#16724c;font-size:12px;font-weight:1000;}
.official-connection.offline{background:#fff8e8;color:#8a5a00;}
.official-fairness{display:inline-flex;align-items:center;min-height:27px;padding:5px 9px;border-radius:999px;background:#eef9f3;color:#16724c;font-size:12px;font-weight:1000;}
.official-fairness.warn{background:#fff8e8;color:#8a5a00;}
.official-connect-recovery{margin:10px 0;padding:12px;border:1.5px solid #e3a7aa;border-radius:8px;background:#fff4f4;color:#8f1d24;}
.official-connect-recovery b{display:block;font-size:14px;}
.official-connect-recovery small{display:block;margin-top:4px;font-size:11px;font-weight:800;line-height:1.5;}
.official-connect-recovery button{width:100%;min-height:44px;margin-top:10px;border:1.5px solid #c9363e;border-radius:8px;background:#c9363e;color:#fff;font:inherit;font-weight:1000;}
.official-connect-recovery button:disabled{opacity:.5;cursor:not-allowed;}
.official-connect-recovery.connecting{border-color:#b8d8ff;background:#f5f9ff;color:#245ca6;}
.official-request-state{margin:0 0 10px;padding:8px 10px;border-radius:7px;background:#f4f7fb;color:#526177;font-size:12px;font-weight:900;}
.official-request-state.done{background:#eef9f3;color:#16724c;}
.official-request-state.error{background:#fff2f2;color:#b42318;}
.official-arrival{margin:12px 0 4px;padding:12px;border:1.5px solid #b8d8ff;border-radius:8px;background:#f5f9ff;}
.official-arrival-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.official-arrival-head b{display:block;color:#245ca6;font-size:14px;}
.official-arrival-head small{display:block;margin-top:3px;color:var(--mut);font-size:11px;font-weight:800;line-height:1.4;}
.official-arrival-count{flex-shrink:0;padding:4px 8px;border-radius:999px;background:#e7f1ff;color:#245ca6;font-size:11px;font-weight:1000;}
.official-arrival-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;}
.official-arrival-actions select{width:100%;min-width:0;min-height:44px;border:1.5px solid #b8d8ff;border-radius:8px;background:#fff;padding:8px 10px;font:inherit;font-weight:900;color:var(--txt);}
.official-arrival-actions button{min-height:44px;border:1.5px solid #6aa6ee;border-radius:8px;background:#3f7fd5;color:#fff;padding:8px 13px;font:inherit;font-weight:1000;white-space:nowrap;}
.official-arrival-actions button:disabled{opacity:.42;cursor:not-allowed;}
.official-live-additions{margin:10px 0 4px;padding:12px;border:1px solid #ead39d;border-left:3px solid #d6ad62;border-radius:8px;background:#fffaf0;}
.official-live-additions-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;color:#75551c;}
summary.official-live-additions-head{cursor:pointer;margin-bottom:0;list-style:none;}
summary.official-live-additions-head::-webkit-details-marker{display:none;}
.official-live-additions[open] summary.official-live-additions-head{margin-bottom:4px;}
.official-live-additions-head b{font-size:14px;}
.official-live-additions-head span{font-size:11px;font-weight:1000;}
.official-live-addition-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #efdfba;}
.official-live-addition-row:first-of-type{border-top:0;}
.official-live-addition-row b{display:block;color:#3f4650;font-size:13px;}
.official-live-addition-row small{display:block;margin-top:2px;color:var(--mut);font-size:11px;font-weight:800;}
.official-live-addition-row button{min-height:38px;border:1px solid #e3a7aa;border-radius:8px;background:#fff;color:#a2282f;padding:7px 9px;font:inherit;font-size:11px;font-weight:1000;}
.official-live-addition-row button:disabled{border-color:#ddd;background:#f5f5f5;color:#999;}
.official-action-list{display:flex;flex-direction:column;border-top:1px solid var(--line);}
.official-action-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.official-action-row span{min-width:0;font-size:13px;font-weight:900;line-height:1.45;overflow-wrap:anywhere;}
.official-action-row small{display:block;color:var(--mut);font-size:11px;font-weight:800;margin-top:2px;}
.official-action-row button,.official-status-actions button{min-height:42px;border:1.5px solid #e3a7aa;border-radius:8px;background:#fff4f4;color:#b42318;padding:8px 12px;font-weight:1000;font-family:inherit;}
.official-action-row button.start{border-color:#9ccfb7;background:#eef9f3;color:#16724c;}
.official-action-row button.yield{border-color:#e8c784;background:#fff9ed;color:#8a5a00;}
.official-action-row button:disabled,.official-status-actions button:disabled{opacity:.42;cursor:not-allowed;}
.official-player-tools{margin-top:12px;}
.official-player-tools summary{cursor:pointer;font-size:13px;font-weight:1000;color:#40506a;list-style:none;}
.official-player-tools summary::-webkit-details-marker{display:none;}
.official-player-tools select{width:100%;margin:10px 0 8px;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;font:inherit;font-weight:800;color:var(--txt);}
.official-status-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
.official-status-actions button{border-color:var(--line);background:#fff;color:#40506a;padding:8px 5px;}
.official-status-actions button.rest{border-color:#e8c784;background:#fff9ed;color:#8a5a00;}
.official-status-actions button.done{border-color:#e3a7aa;background:#fff4f4;color:#b42318;}
.official-member-status{margin:12px 0 4px;padding:12px;border:1.5px solid #c9d8ea;border-radius:8px;background:#fbfdff;scroll-margin-top:12px;}
.official-member-status-head{margin-bottom:9px;}
.official-member-status-head b{display:block;color:#2f4668;font-size:14px;}
.official-member-status-head small{display:block;margin-top:3px;color:var(--mut);font-size:11px;font-weight:800;line-height:1.45;}
.official-member-status select{width:100%;min-height:44px;border:1.5px solid #b8cae1;border-radius:8px;background:#fff;padding:8px 10px;font:inherit;font-weight:900;color:var(--txt);}
.official-member-status-note{min-height:32px;margin:7px 0 8px;padding:7px 9px;border-radius:7px;background:#f2f6fb;color:#526177;font-size:11px;font-weight:900;line-height:1.45;}
.official-member-status-note.playing{background:#fff8e8;color:#8a5a00;}
.official-member-status-note.rest{background:#fff8e8;color:#8a5a00;}
.official-member-status-note.done{background:#fff2f2;color:#a2282f;}
.official-member-status .official-status-actions button{min-height:46px;font-size:12px;line-height:1.25;}
.official-partner{margin:12px 0 4px;padding:12px;border:1.5px solid #9ccfb7;border-radius:8px;background:#f4fbf7;}
.official-partner-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.official-partner-head b{color:#176347;font-size:14px;}
.official-partner-count{flex-shrink:0;padding:4px 8px;border-radius:999px;background:#e2f5ea;color:#176347;font-size:11px;font-weight:1000;}
.official-partner-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px;}
.official-partner-fields label{min-width:0;color:#526177;font-size:11px;font-weight:900;}
.official-partner-fields select{width:100%;min-width:0;min-height:44px;margin:5px 0 0;border:1.5px solid #abd7c3;border-radius:8px;background:#fff;padding:8px 10px;font:inherit;font-weight:900;color:var(--txt);}
.official-partner-note{min-height:29px;margin:7px 0;padding:6px 9px;border-radius:7px;background:#eaf7f0;color:#32654f;font-size:11px;font-weight:900;line-height:1.45;}
.official-partner-submit{width:100%;min-height:44px;border:1.5px solid #64ae8b;border-radius:8px;background:#23835b;color:#fff;font:inherit;font-weight:1000;}
.official-partner-submit:disabled{opacity:.42;cursor:not-allowed;}
.official-partner-list{margin-top:9px;border-top:1px solid var(--line);}
.official-partner-list .official-action-row button{border-color:#e3a7aa;background:#fff4f4;color:#b42318;}
.official-temporary-tools{margin:12px 0 4px;padding:12px;border:1.5px solid #a9cbbc;border-radius:8px;background:#f6fbf8;}
.official-temporary-tools summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;color:#285843;font-size:14px;font-weight:1000;}
.official-temporary-tools summary::-webkit-details-marker{display:none;}
.official-temporary-tools summary span{font-size:11px;color:#648073;}
.official-temporary-add{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:7px;margin-top:10px;}
.official-temporary-add select,.official-temporary-add button{min-width:0;min-height:44px;border:1.5px solid #b9d5c8;border-radius:8px;background:#fff;padding:8px 10px;font:inherit;font-weight:900;color:var(--txt);}
.official-temporary-add button{background:#347c5b;color:#fff;}
.official-temporary-add button:disabled,.official-temporary-add select:disabled{opacity:.42;cursor:not-allowed;}
.official-temporary-note{display:block;margin-top:9px;color:#6b7e75;font-size:11px;font-weight:800;line-height:1.45;}
.after-party-summary{margin:12px -10px 0;border-top:1.5px solid #edc987;border-bottom:1.5px solid #edc987;background:#fffaf0;}
.after-party-main{display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:14px 12px 12px;}
.after-party-heading{display:flex;align-items:center;gap:9px;min-width:0;}
.after-party-count{display:flex;align-items:baseline;gap:2px;flex:0 0 auto;color:#8a5a00;line-height:1;}
.after-party-count strong{font-size:30px;}
.after-party-count span{font-size:12px;font-weight:1000;}
.after-party-copy{min-width:0;}
.after-party-copy b{display:block;font-size:15px;color:var(--txt);}
.after-party-copy small{display:block;margin-top:3px;color:var(--mut);font-size:11px;font-weight:800;line-height:1.45;}
.after-party-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.after-party-actions>button:only-child{grid-column:1/-1;}
.after-party-summary button{min-width:0;min-height:44px;border:1.5px solid #df9a2d;border-radius:8px;background:#fff;color:#8a5a00;font:inherit;font-weight:1000;}
.after-party-summary button.selected{background:#df9a2d;color:#fff;}
.after-party-summary button.copy{border-color:#d9c39b;background:#fffdf8;color:#5f4a25;}
.after-party-summary button:disabled{opacity:.45;cursor:not-allowed;}
.after-party-names{padding:12px;border-top:1px solid #f0d9ad;color:#40506a;font-size:12px;font-weight:900;line-height:1.55;overflow-wrap:anywhere;}
.after-party-names b{display:block;margin-bottom:8px;color:#8a5a00;font-size:12px;}
.after-party-name-cloud{display:flex;flex-wrap:wrap;gap:6px;}
.after-party-name-chip{display:inline-flex;align-items:center;min-height:32px;padding:6px 9px;border:1px solid #efd39e;border-radius:999px;background:#fff;color:#3f321e;font-size:13px;font-weight:1000;}
.after-party-names summary{cursor:pointer;list-style:none;}
.after-party-names summary::-webkit-details-marker{display:none;}
.after-party-names summary{margin-top:9px;padding-top:9px;border-top:1px solid #f0d9ad;color:#8a5a00;}
.after-party-names summary::after{content:'보기';float:right;margin-left:8px;}
.after-party-names[open] summary::after{content:'닫기';}
.after-party-name-list{margin-top:8px;}
@media(max-width:520px){
  .official-arrival-actions{grid-template-columns:minmax(0,1fr);}
  .official-arrival-actions button{width:100%;}
  .official-partner-fields{grid-template-columns:minmax(0,1fr);}
}
@media(max-width:360px){
  .after-party-actions{grid-template-columns:minmax(0,1fr);}
}

/* Mobile safe areas, touch targets, and bottom-sheet containment. */
.wrap{
  padding-top:max(18px,var(--safe-top));
  padding-bottom:max(34px,calc(var(--safe-bottom) + 18px));
}
.toast{bottom:max(16px,calc(var(--safe-bottom) + 8px));}
.complete-picker-backdrop{
  padding-bottom:max(18px,var(--safe-bottom));
}
.complete-picker{
  display:flex;
  flex-direction:column;
  max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 28px);
  overflow:hidden;
}
.complete-picker-head{flex:0 0 auto;}
.complete-picker-list{
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding-bottom:2px;
}
.complete-picker-close,
.my-card-change,
.event-official-complete,
.event-official-active-yield,
.official-action-row button,
.official-status-actions button{min-height:44px;}
@media(max-width:430px){
  .event-active-player,
  .event-next-player{letter-spacing:0;}
  .event-official-complete,.event-official-active-yield{min-height:44px;padding:8px 6px;font-size:12px;}
}
@media(max-width:340px){
  .event-next-line{grid-template-columns:1fr;gap:4px;white-space:normal}
  .event-next-line em{justify-self:center}
  .event-next-player{white-space:normal;overflow:visible;text-overflow:clip}
  .event-next-pair.a .event-next-player,
  .event-next-pair.b .event-next-player{text-align:center}
}

/* 민턴LIVE 회원페이지: 가볍고 일관된 현장 UX */
:root{
  --bg:#f4f7f6;
  --card:#fff;
  --line:#e3e9e7;
  --txt:#202830;
  --mut:#717b84;
  --blue:#557fba;
  --blue2:#f0f5fb;
  --green:#5aa67d;
  --red:#e3525a;
  --amber:#cf9642;
  --blue-deep:#3f679f;
  --green-deep:#347454;
  --red-deep:#ae343c;
  --amber-soft:#fff8ec;
  --shadow:0 6px 18px rgba(32,48,43,.055);
}
body{
  background:#f4f7f6;
  line-height:1.45;
}
body *{letter-spacing:0!important;}
.wrap{
  padding-left:12px;
  padding-right:12px;
}
.hero,
.panel,
.my-card{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  box-shadow:var(--shadow);
}
.hero{
  padding:18px 16px 16px;
  border-top:3px solid #86b99c;
}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--green-deep);
  font-size:12px;
  font-weight:900;
}
.eyebrow:before{
  content:'🏸';
  font-size:14px;
  line-height:1;
}
h1{
  margin:6px 0 5px;
  font-size:26px;
  line-height:1.2;
}
.sub{
  font-size:14px;
  line-height:1.5;
}
.notice{
  margin-top:12px;
  padding:10px 11px;
  border:0;
  border-left:3px solid #a8c8b5;
  border-radius:6px;
  background:#f5f8f7;
  color:#4b5752;
}
.panel{
  margin-top:12px;
  padding:14px;
}
.vote-summary{margin-top:12px;gap:6px;}
.vote-chip{
  padding:9px 7px;
  border:0;
  border-radius:8px;
  background:#f4f6f7;
}
.vote-chip.total{
  border:0;
  background:#eef4fb;
}
.vote-chip.ready{
  border:0;
  background:#eef7f2;
}
.vote-chip.warn{
  border:0;
  background:#fff7eb;
}
.vote-summary.official{grid-template-columns:repeat(4,minmax(0,1fr));}
.vote-summary.official .vote-chip.total{text-align:center;padding:9px 7px;}
.vote-summary.official .vote-chip.total b{font-size:18px;}
.vote-summary.official .vote-chip.total span{font-size:11px;}
.vote-chip.pending{background:#fff9ed;}
.vote-chip.pending b{color:#8a5a00;}
@media(max-width:430px){
  .vote-summary.official{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;}
  .vote-summary.official .vote-chip{padding:8px 3px;}
  .vote-summary.official .vote-chip b{font-size:16px;}
  .vote-summary.official .vote-chip span{font-size:9px;}
}
.toolbar{margin-bottom:10px;}
.search{
  height:46px;
  border-color:#dce4e1;
  border-radius:8px;
  background:#fbfcfc;
}
.search:focus{
  outline:3px solid rgba(85,127,186,.14);
  border-color:#8eacd2;
}
.member-fold{
  border:0;
  border-radius:8px;
  background:transparent;
  overflow:visible;
}
.member-fold summary{
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#f7f9f8;
  color:#43504b;
  font-weight:900;
}
.member-fold[open] summary{
  border-bottom:1px solid var(--line);
  border-radius:8px;
}
.member-fold summary:after{
  padding:0;
  border-radius:0;
  background:transparent;
  color:var(--blue-deep);
}
.member-fold #players{padding:2px 0 0;}
.player{
  margin-top:7px;
  padding:13px;
  border-color:#e0e7e5;
  border-radius:8px;
  background:#fff;
}
.player.selectable{
  border-color:#d8e3df;
  background:#fff;
}
.player.selectable:active{
  transform:translateY(1px);
  background:#f7faf8;
}
.player.selectable .phead{margin-bottom:0;}
.player.selectable .select-hint{display:none;}
.player.selectable .badge{
  border:0;
  background:#eef4fb;
  color:var(--blue-deep);
}
.phead{align-items:center;}
.name{font-size:17px;}
.meta{font-size:12px;line-height:1.45;}
.badge,
.pill,
.my-status-chip,
.event-chip,
.official-connection,
.official-arrival-count,
.official-partner-count,
.after-party-name-chip{
  border-radius:999px;
}
button,
.my-card-change,
.event-complete-btn,
.event-undo-btn,
.queue-defer-btn,
.queue-enter-btn,
.queue-rest-btn,
.complete-picker-close{
  border-radius:8px;
  box-shadow:none;
}
button{
  border-color:#dce4e1;
  font-weight:900;
}
button:focus-visible,
select:focus-visible,
input:focus-visible,
summary:focus-visible{
  outline:3px solid rgba(85,127,186,.18);
  outline-offset:2px;
}
.event-title{
  align-items:flex-end;
  margin-bottom:10px;
}
.event-title b{font-size:19px;}
.event-chip{
  margin:0 4px 5px 0;
  padding:6px 9px;
  background:#f2f5f4;
  color:#53605b;
}
.event-chip.gold{
  background:#fff6e8;
  color:#8a641f;
}
.event-section-title{
  margin:15px 0 7px;
  color:#64716c;
  font-size:12px;
  font-weight:900;
}
.event-list{gap:7px;}
.event-row{
  padding:11px;
  border-color:#e0e7e5;
  border-radius:8px;
  background:#fff;
}
.event-row:not(.next){
  border-color:#e0e7e5;
  background:#fff;
}
.event-row.next,
.event-row.next:first-child{
  border-color:#cfe2d6;
  border-radius:8px;
  background:#f7fbf8;
  box-shadow:none;
}
.event-row.next.priority{
  border-color:#79ad8d;
  background:#f0f8f3;
  box-shadow:0 0 0 2px rgba(90,166,125,.12);
}
.event-row.next.soon,
.event-row.next.due,
.event-row.soon:not(.next),
.event-row.due:not(.next){
  border-color:#efc3c6;
  background:#fff6f6;
}
.event-row.expected,
.event-row.expected:first-child{
  border-color:#dfe7e4;
  background:#fafcfb;
}
.event-court-badge{
  min-width:54px;
  min-height:50px;

/* 전역 button 이 flex-direction:column 을 깔아 두므로(859행) 행 방향을 명시합니다.
   실기기에서 메타가 카드 밖으로 밀려 잘렸던 원인입니다(2026-08-10 실측).
   디자인: 이름 왼쪽·메타 오른쪽 한 줄, 그룹 제목은 스크롤에 고정.
   색은 셋만 — 보통 회색, 다음 대진 예정 호박색, 맞교환 붉은색. */
.replace-picker-list{max-height:min(58vh,460px);overflow-y:auto;gap:8px;padding-top:0;}

  position:sticky;top:0;z-index:1;background:#fff;

  color:var(--mut);font-size:.74rem;font-weight:900;letter-spacing:.01em;

  border:1.5px solid var(--line);border-radius:14px;background:#fff;
  padding:13px 15px;text-align:left;color:var(--txt);cursor:pointer;overflow:visible;
}

.replace-picker-row b{

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.replace-picker-row span{flex-shrink:0;color:var(--mut);font-size:.74rem;font-weight:800;white-space:nowrap;}
.replace-picker-row.queued span{color:#a3720a;}

/* 경기중 딱지 — 골라도 되지만 그 대진은 선수의 경기 종료까지 투입이 보류됩니다. */

   nowrap 텍스트가 그리드 트랙을 넓히지 않도록 min-width:0 이 필수입니다. */
.replace-picker-current{

/* ═══ 임원 버튼 위계 (v1.10.544, 운영자: "중요도에 따라 간결하고 애플스런
   디자인, 이미지 버튼 활용"). 규칙: 문맥마다 채운 파랑 주버튼 하나, 파랑
   tint 는 보조, 흰 바탕+헤어라인은 조용한 버튼, 파괴는 붉은 tint(채우지
   않음). 클래스명은 회귀가 고정하므로 그대로 두고 겉만 이 블록이 바꿉니다. ═══ */
:root{
  --ob-blue:#0a6cff;--ob-blue-deep:#0b4dab;--ob-blue-tint:#eef4ff;
  --ob-red:#d63a41;--ob-red-tint:#fdf1f1;
  --ob-amber:#9a6a12;--ob-amber-tint:#fdf6e7;
  --ob-ink:#1c2836;--ob-mut:#5c6a7a;
  --ob-hairline:rgba(22,34,52,.14);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;}
#officialPanel button,.official-overview-actions button,.official-overview-tool,
.official-overview-detail-head .official-overview-copy,.official-overview-pick button{font-family:inherit;}
#officialPanel button,[data-official-action]{
  transition:transform .12s ease,background .15s ease,opacity .15s ease;
}
#officialPanel button:active:not(:disabled),
[data-official-action]:active:not(:disabled){transform:scale(.965);}
/* 전역 button 이 flex-direction:column 이라 아이콘이 글자 위로 쌓입니다.
   아이콘 버튼만 가로 정렬로 되돌립니다(2026-08-13 리그 실측). */
.event-official-complete,.event-official-cancel,.event-official-enter,
.event-official-yield,.event-official-move,.event-official-queue-remove,
.official-overview-detail-head .official-overview-copy,.official-arrival-actions button{
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:0;
}
.event-official-new-match{display:flex;flex-direction:column;align-items:center;gap:2px;}
.event-official-new-match .ob-ic{margin-right:0;}
.ob-ic{
  width:15px;height:15px;flex-shrink:0;stroke:currentColor;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;margin-right:6px;
}
/* 1) 주버튼 — 채운 파랑(경기 종료·입장 처리·지각 참가 등록) */
.event-official-complete,.event-official-enter,.official-arrival-actions button{
  border:0;border-radius:12px;background:var(--ob-blue);color:#fff;
  font-weight:900;letter-spacing:-.01em;
}
.event-official-complete{min-height:44px;font-size:13px;}
/* 2) 보조 — 파랑 tint(다음 대진 짜기) */
.event-official-new-match{
  border:0!important;border-radius:14px!important;
  background:var(--ob-blue-tint)!important;color:var(--ob-blue-deep)!important;
}
.event-official-new-match small{color:#5b78a5!important;}
/* 3) 조용한 버튼 — 흰 바탕 + 헤어라인(다시 짜기·뒤로·마무리 취소) */
.event-official-move,.event-official-yield,.official-overview-pick button,.official-finish-toggle.undo{
  border:1px solid var(--ob-hairline)!important;border-radius:12px!important;
  background:#fff!important;color:var(--ob-mut)!important;
}
.event-official-active-yield{
  border:1px solid var(--ob-hairline);border-radius:12px;background:#fff;color:var(--ob-amber);
}
.event-official-active-yield small{color:#b08420;}
/* 4) 파괴 — 붉은 tint(경기 취소·대진 삭제) */
.event-official-cancel,.event-official-queue-remove{
  border:0!important;border-radius:12px!important;
  background:var(--ob-red-tint)!important;color:var(--ob-red)!important;
}
/* 5) 운영 도구 4모드 — 세그먼트 컨트롤 */
/* 도구는 눌러야 하는 것들이니 버튼처럼 보이게 둡니다(운영자 2026-08-13
   "버튼 형태로, 중요도 순"). 회색 판 위 글자만 있으면 눌리는지 안 보입니다.
   순서가 곧 중요도라 색은 늘리지 않습니다 — 켜진 것만 채우고, 제외만 붉게. */
/* 3열 고정 — 감싸기에 맡기면 라벨 길이에 따라 묶음이 흐트러집니다(윗줄 명단
   셋 / 아랫줄 운영 설정 셋). */
.official-overview-tools{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;padding:0;border-radius:0;background:transparent;
}
.official-overview-tool{
  flex:0 1 auto;
  border:1px solid var(--ob-hairline);border-radius:11px;background:#fff;color:var(--ob-ink);
  /* 전역 button 이 flex-direction:column 이라 이모지가 윗줄로 올라갑니다
     (2026-08-13 실측 — HANDOFF 에 적힌 그 함정). 행 방향을 명시합니다. */
  display:inline-flex;flex-direction:row;align-items:center;justify-content:center;
  min-height:40px;padding:9px 8px;font-size:14px;font-weight:900;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 1px 2px rgba(20,32,50,.05);
}
.official-overview-tool.danger{color:var(--ob-red);}
.official-overview-tool:disabled{opacity:.4;}
/* 이모지는 글자보다 살짝 크게, 한 칸 띄워서. 컬러 이모지라 파랑으로 채워진
   상태에서도 그대로 보입니다. */
.official-overview-tool .ot-emo{margin-right:4px;font-size:14px;line-height:1;flex:none;}
/* 코트 번호 정정 버튼 — 평소 배지와 같은 모습이되 누를 수 있음을 옅게 알립니다. */
button.event-court-badge.editable{
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  outline:1px dashed rgba(22,34,52,.22);outline-offset:2px;
}
button.event-court-badge.editable:active{transform:scale(.96);}
/* 직접 예약 딱지 — 자동 편성과 한눈에 구분되게 파랑 계열로. */
.event-partner-badge.manual{background:var(--ob-blue-tint);border-color:#bcd3f3;color:var(--ob-blue-deep);}
.replace-picker-current .event-partner-badge.manual{margin:0 0 0 auto;flex-shrink:0;}
/* 상태 문구 + 아이콘 줄을 한 줄에. 문구가 왼쪽, 아이콘이 오른쪽 — 제 줄을
   쓰던 「일시정지」가 차지하던 세로 여백이 사라집니다(2026-08-13). */
.event-next-actionbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:6px;min-width:0;
}
.event-next-actionbar .event-official-icon-row{margin-top:0;flex:none;}
.event-cue.inline{
  margin:0;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 모드 안내 줄과 명부 불러오기도 같은 언어로 — 보라 틴트·초록 점선을 걷어냅니다. */
.official-overview-pick{background:#f7f9fc;border:1px solid var(--ob-hairline);color:var(--ob-mut);}
.official-overview-pick button{border:1px solid var(--ob-hairline);background:#fff;color:var(--ob-mut);}
.official-roster-browse{border:1px solid var(--ob-hairline)!important;background:#fff!important;color:var(--ob-blue-deep)!important;border-radius:11px!important;}
/* 켜진 도구는 채워서 확실히 구분합니다(흰 버튼 사이에서 눌린 게 보여야 함). */
.official-overview-tool.active{
  border:1px solid var(--ob-blue);background:var(--ob-blue);color:#fff;
  box-shadow:0 1px 3px rgba(10,108,255,.3);
}
.official-overview-tool.danger.active{border-color:var(--ob-red);background:var(--ob-red);color:#fff;box-shadow:none;}
/* 조용한 보조 — 명단 복사 */
.official-overview-detail-head .official-overview-copy{
  border:1px solid var(--ob-hairline);border-radius:10px;background:#fff;color:var(--ob-mut);
}
/* 6) 현황 타일·상자 — 얇은 카드 언어로 통일 */
.official-overview{border:1px solid var(--ob-hairline);border-left-width:1px;border-radius:16px;background:#fff;}
.official-overview-stat{border:1px solid var(--ob-hairline);border-radius:12px;font-variant-numeric:tabular-nums;}
/* 전역 button.active(초록 그라디언트 + 흰 글자)가 타일에 새어 들어와 라벨이
   배경색에 묻혔습니다 — 고른 타일의 색은 여기서 끝까지 정합니다. */
.official-overview-stat.active{
  border-color:var(--ob-blue);box-shadow:0 0 0 1.5px var(--ob-blue) inset;
  background:var(--ob-blue-tint);color:var(--ob-blue-deep);
}
.official-overview-stat.active b,.official-overview-stat.active span{color:var(--ob-blue-deep);}
.official-arrival{border:1px solid var(--ob-hairline);border-radius:16px;background:#fff;}
.official-arrival-actions select{border-radius:12px;border-color:var(--ob-hairline);}
.official-finish-toggle{border:0;border-radius:12px;background:var(--ob-amber-tint);color:var(--ob-amber);}
/* ═══ 아이콘 줄 (v1.10.546, 운영자: "5개 버튼은 아이콘으로, 대진 당 상하로
   길어지지 않게, 컬러 줄여 심플하게"). 자주 쓰는 입장 처리만 이름을 달고,
   순서 변경·다시 짜기·삭제는 32px 아이콘 한 줄로 접습니다. ═══ */
.event-official-icon-row{
  display:flex;gap:4px;justify-content:flex-end;margin-top:6px;
}
.event-official-icon{
  width:32px;height:32px;min-height:32px;min-width:32px;flex:none;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:9px;background:#f1f3f6;color:var(--ob-mut);cursor:pointer;
}
.event-official-icon .ob-ic{margin:0;width:16px;height:16px;}
.event-official-icon.danger{color:var(--ob-red);}
/* 재시작은 멈춘 대진을 푸는 유일한 길이라 아이콘 줄에서도 눈에 띄어야 합니다. */
.event-official-icon.primary{background:var(--ob-blue-tint);color:var(--ob-blue-deep);}
.event-official-icon:disabled{opacity:.3;cursor:default;}
/* 색을 줄입니다 — 카드 상태는 테두리 한 겹으로만 말하고, 점선·배경 틴트는 뺍니다. */
.event-panel,.event-panel.live{border-style:solid!important;}
.event-next-player.replaceable,.event-active-player.replaceable{
  border:1px solid var(--ob-hairline);background:transparent;color:inherit;
}
.official-overview-tool{border-style:solid;}
.official-support{border-top-color:var(--ob-hairline);}
.official-panel{border-top:1px solid var(--ob-hairline);}
.event-row.expected{border-style:solid;border-color:var(--ob-hairline);background:#fff;}
.pick-guide{border:1px solid var(--ob-hairline);background:#f7f9fc;color:var(--ob-mut);}
.official-live-additions{border-left-width:1px;border-color:var(--ob-hairline);background:#fff;}
.official-arrival-head b{color:var(--ob-ink);}
.official-arrival-count{background:#f1f3f6;color:var(--ob-mut);}
/* 진행 중 코트의 선수 이름이 이 화면에서 가장 중요한 정보입니다(운영자
   2026-08-13). 이름만 키우고 주변 장식은 그대로 둡니다. 좁은 폭에서 잘리지
   않도록 자간을 조금 더 좁히고 줄바꿈을 허용합니다. */
/* 임원 화면에서 이름은 교체 버튼(.replaceable)으로 그려지고, 그 규칙의
   `font:inherit` 가 폰트 크기·굵기를 되돌립니다. 그래서 크기 규칙은 반드시
   버튼 선택자까지 함께 걸어야 합니다 — 이걸 놓쳐 v546 확대가 실제 화면에는
   적용되지 않았습니다(2026-08-13 실측). */
.event-active-player,
.event-active-player.replaceable{font-size:23px;font-weight:1000;color:#0f172a;line-height:1.16;letter-spacing:-.045em;white-space:normal;word-break:keep-all;}
/* 다음 대진 이름도 같은 이유로 키웁니다. 두 이름이 한 줄에 들어가야 하므로
   진행 중보다 한 단계 작게 두고, 좁으면 줄바꿈을 허용합니다. */
.event-next-line{font-size:19px;letter-spacing:-.045em;white-space:normal;}
.event-next-player,
.event-next-player.replaceable{font-size:19px;font-weight:1000;color:#0f172a;white-space:normal;overflow:visible;text-overflow:clip;word-break:keep-all;}
@media(max-width:360px){
  .event-active-player,.event-active-player.replaceable{font-size:21px;}
  .event-next-line,.event-next-player,.event-next-player.replaceable{font-size:17px;}
}

async function claimOfficialInvite(actorOverride){
  const actor=isLiveOperatorPlayer(actorOverride)?actorOverride:selectedOfficialPlayer();
  if(!actor||!session||isSampleMode())return false;
  if(officialClaimPromise){
    const activeClaim=officialClaimPromise;
    if(officialClaimPlayerId===String(actor.id))return activeClaim;
    await activeClaim;
    if(String(selectedOfficialPlayer()?.id||'')!==String(actor.id))return false;
    return claimOfficialInvite(actor);
  }
  officialClaimPlayerId=String(actor.id);
  const currentClaim=(async()=>{
    claimingOfficial=true;
    officialGrantError='';
    render();
    try{
      const callable=firebase.functions().httpsCallable('claimDailyOfficialInvite');
      const result=await callable({
        checkinId,
        playerId:actor.id,
        ...(pendingOfficialInvite?{inviteToken:pendingOfficialInvite}:{}),
        clientId:officialClientId()
      });
      const grant=result?.data||{};
      if(!grant.grantToken||!grant.expiresAt)throw new Error('grant-missing');
      if(String(grant.playerId||'')!==String(actor.id))throw new Error('grant-player-mismatch');
      if(String(selectedOfficialPlayer()?.id||'')!==String(actor.id))return false;
      officialGrantToken=grant.grantToken;
      officialGrantPlayerId=String(grant.playerId);
      try{localStorage.setItem(officialGrantKey(),JSON.stringify({token:grant.grantToken,expiresAt:grant.expiresAt,playerId:officialGrantPlayerId}));}catch(e){}
      if(pendingOfficialInvite){
        pendingOfficialInvite='';
        try{sessionStorage.removeItem('kokmatch_pending_official_invite_'+checkinId);}catch(e){}
        clearOfficialInviteFromAddress();
      }
      toast(`${actor.name}님 운영 권한 연결 완료 · 바로 처리할 수 있습니다.`);
      return true;
    }catch(e){
      officialGrantError=officialCallableError(e);
      toast(officialGrantError);
      return false;
    }finally{
      claimingOfficial=false;
      render();
    }
  })();
  officialClaimPromise=currentClaim;
  try{return await currentClaim;}
  finally{
    if(officialClaimPromise===currentClaim){
      officialClaimPromise=null;
      officialClaimPlayerId='';
    }
  }
}

  const statuses={

    playing:new Set(['playing']),
    wait:new Set(['wait']),
    rest:new Set(['rest']),
    done:new Set(['done']),
    preArrival:new Set(['invited','planned'])

  const allowed=statuses[filter];
  const list=filter==='total'?players:players.filter(player=>allowed?.has(String(player.status||'')));
  // 이름순 고정. 카드가 이미 상태로 걸러 주기 때문에 이름으로 찾는 편이 빠릅니다.

function remainMinutes(row){
  if(eventFlowPaused()){
    const pausedRemain=Number(row?.remain);
    if(Number.isFinite(pausedRemain))return Math.max(0,pausedRemain);
  }
  if(row&&row.endAt){
    return Math.max(0,Math.ceil((Number(row.endAt)-Date.now())/60000));
  }
  const n=Number(row?.remain);
  if(!Number.isFinite(n))return '진행중';
  return n;
}

  el.innerHTML=`<div class="event-title"><b>운동 현황</b><span>${esc(updated)} 업데이트</span></div>

    <div>${summary}</div>
    ${pauseNotice}
    ${finishNotice}
    ${active?`<div class="event-section-title">진행 중 코트</div><div class="event-list">${active}</div>`:''}
    ${next||undo?`<div class="event-section-title">다음 대진</div><div class="event-list">${undo}${next}</div>`:''}
    ${newMatchButton}`;
}

function statusButtonSpec(p,key){
  if(key==='toggle'){
    const selected=getSelectedStatus(p);
    if(selected==='wait')return {key:'wait',label:'종료',action:'done'};
    if(selected==='done')return {key:'done',label:'복귀',action:'wait'};
    return {key:'wait',label:'복귀',action:'wait'};
  }
  const labels={wait:'복귀',rest:'휴식',done:'종료'};
  return {key,label:labels[key]||compactLabel(key),action:key};
}
function statusActionKeys(p,keys){
  const selected=getSelectedStatus(p);
  if(selected==='wait')return keys.filter(key=>key==='rest'||key==='done');
  if(selected==='rest')return keys.filter(key=>key==='wait'||key==='done');
  if(selected==='done')return keys.filter(key=>key==='wait');
  return keys.filter(key=>key==='rest'||key==='done');
}
function statusButtons(p,keys,disabled){
  const existing=new Set((session?.statuses||[]).map(s=>s.key));
  const selected=getSelectedStatus(p);
  return statusActionKeys(p,keys.filter(k=>k==='toggle'||existing.has(k))).map(k=>{
    const spec=statusButtonSpec(p,k);
    const last=getLastSent();
    const applied=p.status===spec.key;
    const sent=last&&last.playerId===p.id&&last.status===spec.key;
    const active=selected===spec.key;
    const cls=['status-btn',active?'active':'',applied?'applied':'',sent&&!applied?'sent':''].filter(Boolean).join(' ');
    const iconMap={wait:'▶',rest:'☕',done:'⏹'};
    const icon=iconMap[spec.key]||'•';
    return `<button class="${cls}" ${disabled} onclick="sendStatus('${esc(p.id)}','${esc(spec.action)}')"><span class="status-icon">${esc(icon)}</span><span>${esc(spec.label)}</span></button>`;
  }).join('');
}
function statusSection(p,title,keys,disabled){
  const existing=new Set((session?.statuses||[]).map(s=>s.key));
  const usable=keys.filter(k=>existing.has(k));
  if(!usable.length)return '';
  const selected=getSelectedStatus(p);
  const active=usable.includes(selected);
  const state=active?compactLabel(selected):'선택';
  return `<details class="status-section ${active?'active':''}" ${active?'open':''}>
    <summary><span>${esc(title)}</span><small>${esc(state)}</small></summary>
    <div class="compact-actions">${statusButtons(p,usable,disabled)}</div>
  </details>`;
}
function confirmPlayerIdentity(p){
  const last=getLastSent();
  if(last&&last.playerId===p.id)return true;
  /* 처음 고르는 기기에서는 **묻지 않습니다** — 링크를 열고 이름 한 번 누르면 끝
     (운영자 2026-08-15 "선택만 하면 바로"). 확인창은 이 휴대폰에 **이미 다른 사람이
     저장돼 있을 때**만 띄웁니다. 그때는 남의 상태 버튼을 가로채는 셈이라 물어야 합니다. */
  if(!last||!last.playerId)return true;
  return confirm(`현재 이 휴대폰은 ${last.playerName||'다른 분'}님으로 저장되어 있습니다.\n`
    +`${p.name}님으로 바꿀까요?\n이 기기에서 ${p.name}님의 경기 정보와 상태 버튼을 표시합니다.`);
}
function confirmStatusChange(p,status){
  const current=getSelectedStatus(p);
  if(current===status)return true;
  const nextQ=nextQueueForPlayer(p.id);
  const nextOrder=nextQ?parseInt(nextQ.idx,10)||(eventNextList().findIndex(q=>queueIdentity(q)===queueIdentity(nextQ))+1):0;
  const nextWarn=nextQ&&['rest','done'].includes(status)
    ? nextOrder===1
      ? `\n\n다음 대진 1순위라 곧 입장할 차례예요.\n이 버튼을 누르면 1순위 대진이 바로 조정됩니다.`
      : `\n\n현재 다음 대진 ${nextOrder||''}순위에 포함되어 있어요.\n이 버튼을 누르면 준비된 대진이 조정될 수 있습니다.`
    : '';
  if(status==='wait'){
    return confirm(`${p.name}님, 대진에 복귀할까요?\n복귀하면 다시 자동대진 후보에 포함됩니다.`);
  }
  if(status==='rest'){
    const extra=nextOrder===1?'\n정말 쉬어야 할 때만 확인해 주세요.':p.locked?'\n현재 대기표나 경기에서 빠질 수 있습니다.':'\n휴식 중에는 새 대진에 배정되지 않습니다.';
    return confirm(`${p.name}님, 잠시 휴식으로 전환할까요?${nextWarn}${extra}`);
  }
  if(status==='done'){
    return confirm(`${p.name}님, 오늘 운동을 종료할까요?${nextWarn}\n종료하면 새 대진에 배정되지 않습니다. 필요하면 다시 복귀할 수 있어요.`);
  }
  return true;
}
function changeSelectedPlayer(){

  if(!confirm(`${name} 선택을 변경할까요?\n다른 분 이름을 대신 누르는 기능이 아니라, 본인 선택을 바로잡기 위한 기능입니다.`))return;
  clearOfficialGrant('');
  try{localStorage.removeItem(lastKey());}catch(e){}

  query='';

  const q=document.getElementById('search');

  const fold=document.getElementById('playerListFold');
  if(fold)fold.open=true;

}
function selectPlayerIdentity(playerId){
  if(!session)return;
  const p=(session.players||[]).find(x=>x.id===playerId);
  if(!p)return toast('선수를 찾지 못했습니다.');
  if(!confirmPlayerIdentity(p))return;
  const req={
    playerId:p.id,
    playerName:p.name,
    status:getSelectedStatus(p),
    statusLabel:compactLabel(getSelectedStatus(p)),
    savedAt:Date.now(),
    source:'member-identity'
  };
  setLastSent(req);
  query='';
  identityLookupOpen=false;
  const q=document.getElementById('search');
  if(q)q.value='';
  toast(`${p.name}님으로 선택했어요.`);
  render();
  if(isLiveOperatorPlayer(p))claimOfficialInvite(p);
}
function isRapidStatusChange(p,status){
  const last=getLastSent();

}

      </div>

function officialArrivalPlayers(){
  if(session?.event?.finishMode)return [];
  // 명단에 있는 도착 전(planned·invited) 선수는 항상 등록 대상입니다
  // (운영자 2026-08-11 "임원은 도착 전 선수를 참가등록으로 처리할 수 있어야").
  // arrivalCandidates 는 관리자 게시 시점의 스냅샷이라, 게시 후 서버 명령으로
  // 등록된 도착 전 선수가 빠져 있으면 '참가 등록 준비 중'에 갇혔습니다.
  const existing=(session?.players||[])
    .filter(p=>p&&p.name&&['invited','planned'].includes(String(p.status||'')))
    .map(p=>({candidateKey:`player:${p.id}`,kind:'existing',playerId:p.id,name:p.name,status:p.status,lastStatusAt:p.lastStatusAt||0}));
  const seenIds=new Set(existing.map(c=>String(c.playerId)));
  const seenNames=new Set(existing.map(c=>String(c.name).trim()));
  // 명부에서 새로 데려오는 후보(roster)는 스냅샷 기능이 켜져 있을 때만 씁니다.
  const roster=(session?.capabilities?.officialArrivalV1===true&&Array.isArray(session?.arrivalCandidates))
    ? session.arrivalCandidates.filter(c=>c&&c.name&&c.candidateKey
        &&!(c.playerId&&seenIds.has(String(c.playerId)))
        &&!seenNames.has(String(c.name).trim()))
    : [];
  return [...existing,...roster].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
}

function officialPlayerEffectiveLevel(player){

  const level=Number(player?.level||0);
  const female=player?.gender==='F'||player?.gender==='여';
  return Math.round((level-(female?0.5:0)+(ageBonus[player?.ageGroup]||0))*10)/10;

function refreshOfficialPartnerSelection(actorId){
  const a=document.getElementById('officialPartnerA_'+String(actorId||''));
  const b=document.getElementById('officialPartnerB_'+String(actorId||''));
  const panel=a?.closest('[data-official-partner-panel]')||null;
  if(!panel)return;
  const submit=panel.querySelector('[data-official-partner-submit]');
  const note=document.getElementById('officialPartnerNote_'+String(actorId||''));
  if(!a||!b||!submit)return;
  const pending=officialRequests.some(r=>r.type==='official-partner-reservation'&&officialRequestPending(r));
  const finishing=!!session?.event?.finishMode;
  const blocked=eventFlowPaused()||finishing||!!sendingKey||claimingOfficial||pending;
  const updateOptions=(select,otherValue)=>{
    select.disabled=blocked;
    [...select.options].forEach(option=>{
      if(!option.value)return;
      option.disabled=option.dataset.reserved==='true'||(!!otherValue&&String(option.value)===String(otherValue));
    });
  };
  updateOptions(a,b.value);
  updateOptions(b,a.value);
  const selectedPlayers=[a.value,b.value].map(id=>(session?.players||[]).find(player=>String(player.id)===String(id))).filter(Boolean);
  const gapTooWide=selectedPlayers.length===2&&officialPartnerGap(selectedPlayers)>=3;
  const valid=!!a.value&&!!b.value&&a.value!==b.value&&!gapTooWide
    &&a.selectedOptions[0]?.dataset.reserved!=='true'
    &&b.selectedOptions[0]?.dataset.reserved!=='true';
  submit.disabled=blocked||!valid;
  submit.textContent=pending?'접수 중':'같은 편으로 접수';
  if(note){
    const aName=a.selectedOptions[0]?.textContent?.split(' · ')[0]||'';
    const bName=b.selectedOptions[0]?.textContent?.split(' · ')[0]||'';
    note.textContent=finishing
      ? '마무리 중에는 새 파트너 요청을 받지 않습니다.'
      : gapTooWide
        ? '두 선수의 실력 차가 커 공정한 자동 대진으로 편성하기 어렵습니다.'
        : valid
          ? `${aName} · ${bName} 같은 편 요청`
          : a.value&&b.value
            ? '서로 다른 두 선수를 선택하세요.'
            : '같은 편으로 경기할 두 선수를 선택하세요.';
  }
}

function reservationConsentState(req,playerId){

function gameRequestBox(p,disabled){

  const reqs=playerReservationRequests(p.id);
  const pending=reqs.find(r=>!r.appliedAt&&!r.ignoredAt);
  const recentCancelled=reqs.find(r=>r.ignoredAt&&Date.now()-(r.ignoredAt||0)<10*60*1000);
  if(pending){
    return `<details class="game-request" open>
      <summary>이전 파트너 요청</summary>
      <div class="request-status cancelled">회원 직접 요청 방식이 종료되었습니다.

      </div>

        ? '임원 접수 완료 · 상대 경기 중'
        : (isPartner?'파트너 접수 완료':'게임 등록 완료');
    const mainText=stateClass==='waiting-player'?prefix:`${prefix} · ${status}`;
    const detailHtml=activeReservation.statusDetail?`<small>${esc(activeReservation.statusDetail)}</small>`:'';
    return `<details class="game-request" open>
      <summary>${isPartner?'파트너 접수':'게임 등록'}</summary>
      <div class="request-status done ${esc(stateClass)}"><span class="request-chip">임원 접수</span>${esc(mainText)}
        ${detailHtml}
        <small>${esc(sessionReservationLabel(activeReservation))}</small>
      </div>
    </details>`;
  }
  const cancelledHtml=recentCancelled?`<div class="request-status cancelled">최근 신청이 자동 취소됐습니다.<small>${esc(recentCancelled.reason||reservationRequestLabel(recentCancelled))}</small></div>`:'';
  return cancelledHtml||'';
}
