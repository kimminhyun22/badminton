<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-version" content="1.10.718"><meta name="referrer" content="no-referrer">
  <title>우리 클럽 미세조정 · 콕매치</title>
  <link rel="stylesheet" href="css/skill-review.css?v=1.10.718">
  <script defer src="functions/skill-calibration-core.js?v=1.10.718"></script>
  <script defer src="js/club-skill-review.js?v=1.10.718"></script>
</head>
<body>
  <header><a id="back" href="index.html">돌아가기</a><h1>우리 클럽 미세조정</h1></header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="setup" hidden>
      <label>클럽 명부<select id="club"></select></label>
      <button id="create" class="primary">퀴즈 만들기</button>
      <p class="muted">공유받은 분에게 회원 이름·급수·연령·성별이 보입니다. 신뢰하는 1~3명에게만 보내 주세요.</p>
      <label id="historyLabel" hidden>만든 퀴즈<select id="history"></select></label>
    </section>
    <section id="owner" hidden>
      <h2 id="clubTitle"></h2>
      <div class="toolbar"><label>공유 대상<select id="expert"><option value="0">판단자 1</option><option value="1">판단자 2</option><option value="2">판단자 3</option></select></label><button id="share">링크 공유</button></div>
      <button id="answerSelf" class="primary">비교 시작</button>
      <p class="muted">직접 답하면 판단자 1입니다. 다른 분께는 2·3번 링크를 보내 주세요.</p>
      <p id="notice" role="status"></p><div id="proposals"></div>
      <details><summary>관리</summary><div class="toolbar"><button id="refresh">결과 새로고침</button><button id="close">응답 마감</button></div><p id="expiry" class="muted"></p>
        <p class="muted">임시 보정은 명부·대진에 적용되지 않습니다. 같은 선수의 서로 다른 상대 3명 이상에서 80% 이상 같은 조정 방향이고 판단자 간 충돌이 없으면 적용 검토를 알립니다. 통계적 확정이 아닌 검토 기준입니다.</p>
      </details>
    </section>
    <section id="quiz" hidden>
      <p id="progress" class="muted"></p><h2>누구와 편을 하면 더 유리할까요?</h2>
      <p class="muted">파트너와 상대는 같다고 생각해 주세요.</p>
      <div id="choices" class="choices">
        <div id="sides" class="question-sides"></div>
        <button data-vote="tie">비슷해요</button><button data-vote="skip">잘 모르겠어요</button>
      </div>
      <button id="retry" hidden>응답 다시 보내기</button>
    </section>
    <section id="done" hidden><h2>비교를 마쳤습니다.</h2><p id="doneText" class="muted"></p><button id="more">남은 비교 계속</button><button id="ownerReturn" class="primary" hidden>보정안 보기</button></section>
  </main>
</body></html>
