<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>콕매치 클럽 자율 배포 로드맵</title>
  <style>
    :root{
      --ink:#172033;--muted:#68758a;--line:#dce4ef;--paper:#fff;--canvas:#f4f7fb;
      --blue:#2f6edb;--blue-soft:#edf4ff;--green:#227852;--green-soft:#eaf7f0;
      --amber:#9a6400;--amber-soft:#fff6df;--red:#b53b42;--red-soft:#fff0f1;
    }
    *{box-sizing:border-box}
    html{background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:0}
    body{margin:0;min-width:320px;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
    a{color:inherit}
    button,a{touch-action:manipulation}
    .shell{max-width:980px;margin:0 auto;background:var(--paper);min-height:100vh;border-inline:1px solid var(--line)}
    header{padding:28px clamp(20px,5vw,52px) 24px;border-bottom:1px solid var(--line);background:#f9fbfe}
    .eyebrow{margin:0 0 6px;color:var(--blue);font-size:13px;font-weight:800}
    h1{margin:0;font-size:clamp(25px,5vw,34px);line-height:1.25;font-weight:900}
    .updated{margin:8px 0 0;color:var(--muted);font-size:13px}
    .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
    .links a{display:inline-flex;align-items:center;min-height:40px;padding:8px 13px;border:1px solid #bfd1eb;border-radius:8px;background:#fff;color:#285da9;text-decoration:none;font-weight:800;font-size:13px}
    .band{padding:24px clamp(20px,5vw,52px);border-bottom:1px solid var(--line)}
    .band h2{margin:0 0 10px;font-size:19px;font-weight:900}
    .goal{font-size:18px;font-weight:750;line-height:1.65}
    .current{margin-top:14px;padding:14px 16px;border-left:4px solid var(--blue);background:var(--blue-soft);border-radius:0 6px 6px 0;color:#30415e}
    .next{margin-top:14px;padding:14px 16px;border-left:4px solid var(--green);background:var(--green-soft);border-radius:0 6px 6px 0}
    .next b{display:block;margin-bottom:3px;color:var(--green)}
    .criteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;margin:14px 0 0;padding:0;list-style:none}
    .criteria li{position:relative;padding:8px 0 8px 20px;border-bottom:1px solid #edf1f6}
    .criteria li::before{content:"";position:absolute;left:1px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--green)}
    .summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .summary span,.state{display:inline-flex;align-items:center;min-height:30px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:850;border:1px solid var(--line);background:#fff}
    main{padding:0}
    .stage{padding:24px clamp(20px,5vw,52px);border-bottom:1px solid var(--line)}
    .stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
    .stage h2{margin:0;font-size:21px;font-weight:900}
    .owner{margin-top:4px;color:var(--muted);font-size:13px}
    .state.done,.status.done{color:var(--green);border-color:#b9dfcb;background:var(--green-soft)}
    .state.in_progress,.status.in_progress{color:var(--blue);border-color:#bfd3f4;background:var(--blue-soft)}
    .state.blocked,.status.blocked{color:var(--red);border-color:#efc6c9;background:var(--red-soft)}
    .state.waiting,.status.waiting{color:var(--amber);border-color:#edd497;background:var(--amber-soft)}
    .state.later,.status.later{color:#586477;background:#f2f5f8}
    .items{border-top:1px solid var(--line)}
    .item{display:grid;grid-template-columns:minmax(170px,.85fr) minmax(260px,1.65fr);gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0}
    .item-title{font-weight:850}
    .status{display:inline-flex;margin-top:6px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:850}
    .detail{color:#46536a}
    .evidence{display:inline-block;margin-top:7px;color:#2c65bd;font-size:13px;font-weight:750;text-decoration:none}
    .risks{margin:12px 0 0;padding-left:20px}
    .risks li{margin:8px 0;color:#49566d}
    .note{color:var(--muted);font-size:13px}
    footer{padding:20px clamp(20px,5vw,52px);color:var(--muted);font-size:12px;background:#f9fbfe}
    @media(max-width:640px){
      header,.band,.stage{padding-inline:20px}
      .criteria{grid-template-columns:1fr}
      .stage-head{display:block}
      .state{margin-top:9px}
      .item{grid-template-columns:1fr;gap:8px}
      .links a{flex:1 1 calc(50% - 8px);justify-content:center}
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <p class="eyebrow">고정 진행 현황판</p>
      <h1 id="title"></h1>
      <p class="updated" id="updated"></p>
      <nav class="links" id="links" aria-label="관련 링크"></nav>
    </header>
    <section class="band">
      <h2>최종 목표</h2>
      <div class="goal" id="goal"></div>
      <div class="current" id="current"></div>
      <div class="next"><b>다음 행동</b><span id="next"></span></div>
      <div class="summary" id="summary" aria-label="작업 상태 요약"></div>
    </section>
    <section class="band">
      <h2>완료 기준</h2>
      <ul class="criteria" id="criteria"></ul>
    </section>
    <main id="stages"></main>
    <section class="band">
      <h2>위험과 의존성</h2>
      <ul class="risks" id="risks"></ul>
      <p class="note" id="note"></p>
    </section>
    <footer>이 현황판은 roadmap.json의 확인된 상태를 보여 줍니다. 실제 운영 성과와 계획을 구분합니다.</footer>
  </div>
  <script>
    const data={"updated":"2026-09-26","title":"콕매치 · 클럽 자율 배포 로드맵","links":[{"label":"우리 클럽 미세조정","url":"../../skill-review.html"},{"label":"콕매치","url":"https://kimminhyun22.github.io/badminton/"},{"label":"실행 계획","url":"PUBLIC_ROLLOUT_ROADMAP_2026-09-17.md"},{"label":"기반 감사","url":"FOUNDATION_AUDIT_2026-09-17.md"},{"label":"민턴LIVE 현황","url":"../minton-live/BACKLOG.md"}],"goal":"각 클럽과 정기모임이 중앙 시스템 관리자의 설정 없이 독립 공간을 만들고, 하나의 명부와 영구 링크로 자유운동과 팀전을 반복 운영한다.","current":"현장 대진과 임원 운영은 실전 수준으로 동작하며 휴대폰·태블릿 같은 링크 운영 화면을 분리 최적화했습니다. 다음은 클럽별 데이터 격리 계약과 셀프 생성 서버 경계입니다.","criteria":["처음 온 운영자가 도움 없이 5분 안에 클럽 공간과 영구 링크 생성","30명 안팎 명단을 붙여넣어 10분 안에 첫 운동 시작","다음 정기운동은 기존 명부로 1분 안에 시작","자유운동과 팀전이 같은 클럽 명부 사용","회원은 가입 없이 같은 링크에서 현재·다음 경기 확인","휴대폰·태블릿에서 같은 링크로 조회와 현장 운영 가능","대표 기기를 잃어도 다른 기기에서 권한과 명부 복구","클럽 간 명부·운동·운영 권한 완전 격리","파일럿 3개 클럽이 각 3회 이상 중앙 관리자 개입 없이 운영"],"next":"두 합성 클럽의 격리 회귀 검사를 먼저 만들고 createClub 셀프 생성 서버 계약을 설계·구현하기","note":"구현·테스트·배포·실사용 검증을 구분합니다. 완료율을 임의로 계산하지 않으며, 실제 파일럿 결과만 운영 완료로 판정합니다.","risks":["현재 최초 링크와 관리자 원본 일부가 한 브라우저 localStorage에 의존","database.rules.json은 동결 상태이며 공개화 보안 변경은 별도 승인·검증 필요","롤오버 보관·고아 기록 등 민턴LIVE 백로그 결함 2~5가 공개 파일럿 선행 항목","공개 생성에는 App Check·요청 제한·자동 만료·비용 관찰이 필요"],"stages":[{"id":"foundation","name":"공개화 기반","state":"진행 중","owner":"Codex","items":[{"name":"우리 클럽 개인 실력 미세조정","status":"done","detail":"좌우 카드 연속 비교·중간 저장·90일 재점검. 결과에서 미반영/실제 명부 반영 완료 구분, 개인 점수 증감과 상대별 근거 확인. 기존 응답·계산 기준 유지. 실사용 정확도 검증 대기.","evidence":"../minton-live/SKILL_POLICY_REVIEW.md"},{"name":"목표·완료 기준·실행 순서 고정","status":"done","detail":"클럽별 영구 공간, 공용 명부, 같은 링크 운영, 파일럿 기준을 로드맵으로 고정했습니다.","evidence":"PUBLIC_ROLLOUT_ROADMAP_2026-09-17.md"},{"name":"현재 구조와 공개화 장애물 감사","status":"done","detail":"관리자 localStorage, 최초 링크 생성, 명부 분리, 복구·보안 경계를 확인하고 목표 구조를 정했습니다.","evidence":"FOUNDATION_AUDIT_2026-09-17.md"},{"name":"휴대폰·태블릿 공통 운영 화면","status":"done","detail":"700px부터 회원 대진과 임원 현황을 두 열로 전환하고 관리자 조작창을 넓혀 카카오톡 인앱브라우저에서도 태블릿 공간을 사용합니다.","evidence":"../../tests/tablet-layout-regression.js"},{"name":"클럽 데이터 격리 계약과 회귀 검사","status":"in_progress","detail":"합성 클럽 A와 B의 명부·이벤트·권한이 섞이지 않는 서버 계약을 먼저 고정합니다."},{"name":"기존 클럽 호환·이관 경계","status":"waiting","detail":"현재 일만클럽 운영 흐름을 유지한 채 새 클럽 공간을 병행하고, 자동 변환은 파일럿 뒤 판단합니다."}]},{"id":"club-create","name":"클럽 셀프 생성","state":"다음","owner":"Codex","items":[{"name":"우리 클럽 만들기","status":"waiting","detail":"클럽명과 최소 정보만 입력하면 생성자를 대표로 등록하고 독립 공간을 만듭니다."},{"name":"영구 링크와 운영 복구","status":"waiting","detail":"회원 링크는 계속 재사용하고 대표 기기 분실 시 안전하게 운영 권한을 복구합니다."},{"name":"클럽 삭제·내보내기","status":"waiting","detail":"대표가 데이터 사본을 받고 클럽·운동·보관 기록을 실제로 제거할 수 있게 합니다."}]},{"id":"shared-roster","name":"민턴·팀전 공용 명부","state":"다음","owner":"Codex","items":[{"name":"명단 한 번 붙여넣기","status":"waiting","detail":"다양한 구분자의 이름·성별·급수를 정리하고 중복·누락을 확인한 뒤 저장합니다."},{"name":"임원 지정과 프로필 수정","status":"waiting","detail":"명부에서 대표·임원을 지정하고 급수 변경은 다음 대진부터 두 운영 방식에 공통 반영합니다."},{"name":"오늘 참가자 선택","status":"waiting","detail":"같은 명부에서 자유운동 또는 팀전 참가자를 선택하며 중복 등록하지 않습니다."}]},{"id":"recurring-operation","name":"같은 링크로 반복 운영","state":"후속","owner":"Codex · 클럽 임원 실사용","items":[{"name":"오늘 자유운동·팀전 열기","status":"later","detail":"행사명을 다시 만들지 않고 날짜·참가자·코트·방식만 확인해 시작합니다."},{"name":"영구 회원 링크 자동 연결","status":"later","detail":"회원은 같은 링크에서 현재 열린 운동으로 들어가며 운동이 없으면 준비 중 상태만 봅니다."},{"name":"임원·운영 도우미 현장 운영","status":"later","detail":"별도 임원 링크 없이 같은 화면에서 권한을 확인하고, 도우미 권한은 운동 종료 시 해제합니다."}]},{"id":"safety","name":"보안·복구·비용","state":"공개 전 필수","owner":"Codex · Firebase 설정 승인","items":[{"name":"클럽 접근 경계와 인증","status":"blocked","detail":"현재 database.rules.json 동결 상태입니다. 별도 승인 뒤 백업·에뮬레이터·격리 시험을 거쳐야 합니다."},{"name":"App Check·요청 제한·중복 방지","status":"waiting","detail":"정상 앱 요청만 받고 반복 생성·무한 재시도·같은 명령 중복 적용을 제한합니다."},{"name":"만료·보관·복원","status":"waiting","detail":"오래된 이벤트와 고아 보관 기록을 정리하고 백업에서 실제 복원합니다."}]},{"id":"pilot","name":"클럽 파일럿","state":"선행 단계 이후","owner":"클럽 임원 · Codex 개선","items":[{"name":"3개 클럽 온보딩","status":"later","detail":"설명 없이 클럽 생성·명단 등록·영구 링크 배포까지 걸린 시간과 막힌 지점을 기록합니다."},{"name":"클럽별 3회 반복 운영","status":"later","detail":"자유운동과 팀전을 포함해 중앙 관리자 개입, 동기화 오류, 복구 요청을 확인합니다."},{"name":"공개 판정","status":"later","detail":"완료 기준과 치명적 오류 0건을 확인한 뒤 누구나 생성할 수 있게 엽니다."}]}]};
    const labels={done:'완료',in_progress:'진행 중',waiting:'대기',later:'후속',blocked:'막힘'};
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    document.title=data.title;
    document.getElementById('title').textContent=data.title;
    document.getElementById('updated').textContent=`최종 갱신 ${data.updated}`;
    document.getElementById('goal').textContent=data.goal;
    document.getElementById('current').textContent=data.current;
    document.getElementById('next').textContent=data.next;
    document.getElementById('note').textContent=data.note;
    document.getElementById('links').innerHTML=data.links.map(link=>`<a href="${esc(link.url)}">${esc(link.label)}</a>`).join('');
    document.getElementById('criteria').innerHTML=data.criteria.map(text=>`<li>${esc(text)}</li>`).join('');
    document.getElementById('risks').innerHTML=data.risks.map(text=>`<li>${esc(text)}</li>`).join('');
    const items=data.stages.flatMap(stage=>stage.items);
    const counts=items.reduce((acc,item)=>(acc[item.status]=(acc[item.status]||0)+1,acc),{});
    document.getElementById('summary').innerHTML=['done','in_progress','waiting','blocked','later']
      .filter(status=>counts[status])
      .map(status=>`<span class="status ${status}">${labels[status]} ${counts[status]}</span>`).join('');
    document.getElementById('stages').innerHTML=data.stages.map(stage=>{
      const stageStatus=stage.state.includes('완료')?'done':stage.state.includes('진행')?'in_progress':stage.state.includes('필수')?'blocked':stage.state.includes('다음')?'waiting':'later';
      const rows=stage.items.map(item=>`<div class="item">
        <div><div class="item-title">${esc(item.name)}</div><span class="status ${esc(item.status)}">${esc(labels[item.status]||item.status)}</span></div>
        <div class="detail">${esc(item.detail)}${item.evidence?`<br><a class="evidence" href="${esc(item.evidence)}">근거 보기</a>`:''}</div>
      </div>`).join('');
      return `<section class="stage" id="${esc(stage.id)}"><div class="stage-head"><div><h2>${esc(stage.name)}</h2><div class="owner">담당 ${esc(stage.owner)}</div></div><span class="state ${stageStatus}">${esc(stage.state)}</span></div><div class="items">${rows}</div></section>`;
    }).join('');
  </script>
</body>
</html>
